  runtime-validator-blue: &runtime-validator
    <<: *runtime
    command: ["python", "-m", "workers.runner", "--worker", "wa_validator"]
    healthcheck: {disable: true}
    labels: {brain.service: conversation-runtime, brain.slot: blue, brain.worker-group: validator}
  runtime-validator-green:
    <<: *runtime-validator
    image: ${RUNTIME_IMAGE_GREEN:?digest required}
    environment:
      <<: *private-urls
      BRAIN_SLOT: green
      SOURCE_SHA: ${RUNTIME_SHA:?runtime SHA required}
      BUILD_DIGEST: ${RUNTIME_DIGEST:?runtime digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
    labels: {brain.service: conversation-runtime, brain.slot: green, brain.worker-group: validator}

  transport-dispatch-blue: &transport-dispatch
    <<: *transport
    command: ["python", "-m", "workers.runner", "--worker", "whatsapp_dispatch"]
    healthcheck: {disable: true}
    labels: {brain.service: transport, brain.slot: blue, brain.worker-group: transport}
  transport-dispatch-green:
    <<: *transport-dispatch
    image: ${TRANSPORT_IMAGE_GREEN:?digest required}
    environment:
      <<: *private-urls
      BRAIN_SLOT: green
      SOURCE_SHA: ${TRANSPORT_SHA:?transport SHA required}
      BUILD_DIGEST: ${TRANSPORT_DIGEST:?transport digest required}
