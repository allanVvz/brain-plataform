x-api: &api
  restart: unless-stopped
  stop_grace_period: 2m
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=4)"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 20s
  networks: [backend]

x-private-urls: &private-urls
  BRAIN_CONTROL_PLANE_URL: http://caddy:8090/control-plane
  BRAIN_RUNTIME_URL: http://caddy:8090/conversation-runtime
  BRAIN_TRANSPORT_URL: http://caddy:8090/transport

services:
  gateway-blue: &gateway
    <<: *api
    image: ${GATEWAY_IMAGE_BLUE:?digest required}
    env_file: ["${GATEWAY_ENV_FILE:?gateway env file required}"]
    environment:
      <<: *private-urls
      BRAIN_SLOT: blue
      SOURCE_SHA: ${GATEWAY_SHA:?gateway SHA required}
      BUILD_DIGEST: ${GATEWAY_DIGEST:?gateway digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
    labels: {brain.service: gateway, brain.slot: blue}
  gateway-green:
    <<: *gateway
    image: ${GATEWAY_IMAGE_GREEN:?digest required}
    environment:
      <<: *private-urls
      BRAIN_SLOT: green
      SOURCE_SHA: ${GATEWAY_SHA:?gateway SHA required}
      BUILD_DIGEST: ${GATEWAY_DIGEST:?gateway digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
    labels: {brain.service: gateway, brain.slot: green}

  control-plane-blue: &control-plane
    <<: *api
    image: ${CONTROL_PLANE_IMAGE_BLUE:?digest required}
    env_file: ["${CONTROL_PLANE_ENV_FILE:?control-plane env file required}"]
    environment:
      <<: *private-urls
      BRAIN_SLOT: blue
      SOURCE_SHA: ${CONTROL_PLANE_SHA:?control-plane SHA required}
      BUILD_DIGEST: ${CONTROL_PLANE_DIGEST:?control-plane digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
    labels: {brain.service: control-plane, brain.slot: blue}
  control-plane-green:
    <<: *control-plane
    image: ${CONTROL_PLANE_IMAGE_GREEN:?digest required}
    environment:
      <<: *private-urls
      BRAIN_SLOT: green
      SOURCE_SHA: ${CONTROL_PLANE_SHA:?control-plane SHA required}
      BUILD_DIGEST: ${CONTROL_PLANE_DIGEST:?control-plane digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
    labels: {brain.service: control-plane, brain.slot: green}

  runtime-blue: &runtime
    <<: *api
    image: ${RUNTIME_IMAGE_BLUE:?digest required}
    env_file: ["${RUNTIME_ENV_FILE:?runtime env file required}"]
    environment:
      <<: *private-urls
      BRAIN_SLOT: blue
      SOURCE_SHA: ${RUNTIME_SHA:?runtime SHA required}
      BUILD_DIGEST: ${RUNTIME_DIGEST:?runtime digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
    labels: {brain.service: conversation-runtime, brain.slot: blue}
  runtime-green:
    <<: *runtime
    image: ${RUNTIME_IMAGE_GREEN:?digest required}
    environment:
      <<: *private-urls
      BRAIN_SLOT: green
      SOURCE_SHA: ${RUNTIME_SHA:?runtime SHA required}
      BUILD_DIGEST: ${RUNTIME_DIGEST:?runtime digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
    labels: {brain.service: conversation-runtime, brain.slot: green}

  transport-blue: &transport
    <<: *api
    image: ${TRANSPORT_IMAGE_BLUE:?digest required}
    env_file: ["${TRANSPORT_ENV_FILE:?transport env file required}"]
    environment:
      <<: *private-urls
      BRAIN_SLOT: blue
      SOURCE_SHA: ${TRANSPORT_SHA:?transport SHA required}
      BUILD_DIGEST: ${TRANSPORT_DIGEST:?transport digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
    labels: {brain.service: transport, brain.slot: blue}
  transport-green:
    <<: *transport
    image: ${TRANSPORT_IMAGE_GREEN:?digest required}
    environment:
      <<: *private-urls
      BRAIN_SLOT: green
      SOURCE_SHA: ${TRANSPORT_SHA:?transport SHA required}
      BUILD_DIGEST: ${TRANSPORT_DIGEST:?transport digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
    labels: {brain.service: transport, brain.slot: green}

  control-plane-knowledge-blue: &control-plane-knowledge
    <<: *control-plane
    command: ["python", "-m", "workers.runner", "--worker", "kb_sync"]
    healthcheck: {disable: true}
    labels: {brain.service: control-plane, brain.slot: blue, brain.worker-group: knowledge}
