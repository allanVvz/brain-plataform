  runtime-conversation-blue: &runtime-conversation
    <<: *runtime
    command: ["python", "-m", "workers.runner", "--worker", "inactivity_recovery"]
    healthcheck: {disable: true}
    labels: {brain.service: conversation-runtime, brain.slot: blue, brain.worker-group: conversation}
  runtime-conversation-green:
    <<: *runtime-conversation
    image: ${RUNTIME_IMAGE_GREEN:?digest required}
    environment:
      <<: *private-urls
      BRAIN_SLOT: green
      SOURCE_SHA: ${RUNTIME_SHA:?runtime SHA required}
      BUILD_DIGEST: ${RUNTIME_DIGEST:?runtime digest required}
      BRAIN_CONTRACTS_VERSION: ${BRAIN_CONTRACTS_VERSION:-1.0.0}
      REQUIRED_SCHEMA_VERSION: "131"
