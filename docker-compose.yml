name: brain-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  PORT: "8080"
  SUPABASE_URL: http://kong:8000
  SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?set SUPABASE_PUBLIC_URL}
  SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY}
  SUPABASE_SSL_VERIFY: "false"
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
  ALLOWED_ORIGIN_REGEX: ${ALLOWED_ORIGIN_REGEX:-}
  AI_BRAIN_AUTH_SECRET: ${AI_BRAIN_AUTH_SECRET:?set AI_BRAIN_AUTH_SECRET}
  AI_BRAIN_WEBHOOK_TOKEN: ${AI_BRAIN_WEBHOOK_TOKEN:?set AI_BRAIN_WEBHOOK_TOKEN}
  META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}
  META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
  META_WHATSAPP_ALLOW_UNSIGNED_LOCAL: ${META_WHATSAPP_ALLOW_UNSIGNED_LOCAL:-false}
  EVOLUTION_ENABLED: ${EVOLUTION_ENABLED:-false}
  EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
  EVOLUTION_API_VERSION: ${EVOLUTION_API_VERSION:-2.3.7}
  EVOLUTION_AUTHENTICATION_API_KEY: ${EVOLUTION_AUTHENTICATION_API_KEY:-}
  EVOLUTION_WEBHOOK_HMAC_SECRET: ${EVOLUTION_WEBHOOK_HMAC_SECRET:-}
  AI_BRAIN_SECRETS_KEY: ${AI_BRAIN_SECRETS_KEY:-}
  AI_BRAIN_PUBLIC_API_URL: ${AI_BRAIN_PUBLIC_API_URL:-}
  API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8080}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
  GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
  N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
  N8N_API_KEY: ${N8N_API_KEY:-}
  AI_BRAIN_COOKIE_SECURE: ${AI_BRAIN_COOKIE_SECURE:-true}
  LOCAL_STORAGE_DIR: /data/local-storage
  VAULT_PATH: /data/vault
  VAULT_SOURCE_MODE: local
  RUN_EMBEDDED_WORKERS: "false"
  SOFIA_TOOLS_ENABLED: ${SOFIA_TOOLS_ENABLED:-true}
  BULK_CAMPAIGNS_ROLLOUT1_ENABLED: ${BULK_CAMPAIGNS_ROLLOUT1_ENABLED:-}
  AI_BRAIN_META_MOCK: ${AI_BRAIN_META_MOCK:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  WA_VALIDATOR_RUNNER_URL: ${WA_VALIDATOR_RUNNER_URL:-http://wa-validator:3010}
  WA_VALIDATOR_RUN_ENABLED: ${WA_VALIDATOR_RUN_ENABLED:-false}
  WA_VALIDATOR_RETENTION_ENABLED: ${WA_VALIDATOR_RETENTION_ENABLED:-false}
  # Inbound WhatsApp media. WHATSAPP_MEDIA_HOLD_SECONDS is how long a reply
  # waits for the file to be downloaded and read; when it expires the
  # conversation continues with a placeholder instead of stalling.
  WHATSAPP_MEDIA_HOLD_SECONDS: ${WHATSAPP_MEDIA_HOLD_SECONDS:-45}
  # Voice-note transcription (faster-whisper, local). `small` in int8 holds
  # roughly 0.5-1 GB resident in the workers container — raise
  # WORKERS_MEMORY_LIMIT alongside it, or drop to `base`/`tiny` on a small VPS.
  WHISPER_MODEL: ${WHISPER_MODEL:-small}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brain}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  db-bootstrap:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-brain}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:-}
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        until pg_isready -h "$${PGHOST}" -U "$${PGUSER}" -d "$${PGDATABASE}"; do sleep 2; done
        psql -v ON_ERROR_STOP=1 -v postgres_password="$${PGPASSWORD}" <<'SQL'
        DO $$$$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN;
          END IF;
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN;
          END IF;
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
          END IF;
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
            CREATE ROLE authenticator NOINHERIT LOGIN;
          END IF;
          -- Always created (unlike evolution's role below) so migration
          -- 107's GRANT statements never fail on a missing role just
          -- because the observability profile isn't enabled on this
          -- deploy -- it only gets LOGIN/a password conditionally, further
          -- down, when GRAFANA_PG_PASSWORD is actually set.
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'grafana_reader') THEN
            CREATE ROLE grafana_reader NOLOGIN;
          END IF;
        END
        $$$$;
        ALTER ROLE authenticator WITH LOGIN PASSWORD :'postgres_password';
        GRANT anon, authenticated, service_role TO authenticator;
        CREATE SCHEMA IF NOT EXISTS storage;
        GRANT USAGE ON SCHEMA public, storage TO anon, authenticated, service_role;
        GRANT ALL ON SCHEMA public, storage TO service_role;
        SQL
        if [ -n "$${GRAFANA_PG_PASSWORD}" ]; then
          psql -v ON_ERROR_STOP=1 -v grafana_password="$${GRAFANA_PG_PASSWORD}" <<'SQL'
        ALTER ROLE grafana_reader WITH LOGIN PASSWORD :'grafana_password';
        DO $$$$
        BEGIN
          EXECUTE format('GRANT CONNECT ON DATABASE %I TO grafana_reader', current_database());
        END
        $$$$;
        SQL
        fi
        if [ -n "$${EVOLUTION_DB_PASSWORD}" ]; then
          psql -v ON_ERROR_STOP=1 -v evolution_password="$${EVOLUTION_DB_PASSWORD}" <<'SQL'
        DO $$$$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'evolution') THEN
            CREATE ROLE evolution LOGIN;
          END IF;
        END
        $$$$;
        ALTER ROLE evolution WITH LOGIN PASSWORD :'evolution_password';
        SELECT 'CREATE DATABASE evolution OWNER evolution'
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'evolution')\gexec
        SQL
        fi
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks: [backend]

  migrate:
    image: ${MIGRATE_IMAGE:-brain-migrate}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/migrate.Dockerfile
      args:
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-brain}
      PGSSLMODE: disable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APPLY_LEGACY_BOOTSTRAP: ${APPLY_LEGACY_BOOTSTRAP:-1}
      APPLY_SEED: "0"
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks: [backend]

  rest:
    image: postgrest/postgrest:v12.2.8
    environment:
      PGRST_DB_URI: postgresql://authenticator:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brain}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: ${REST_MEMORY_LIMIT:-512m}
    logging: *default-logging
    networks: [backend]

  storage:
    image: supabase/storage-api:v1.11.13
    environment:
      ANON_KEY: ${ANON_KEY:?set ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brain}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: brain-ai
      REGION: local
      GLOBAL_S3_BUCKET: brain-ai
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    mem_limit: ${STORAGE_MEMORY_LIMIT:-512m}
    logging: *default-logging
    networks: [backend]

  kong:
    image: kong:3.8
    # Docker Desktop can restart this container without recreating its
    # writable layer. Remove only Kong's stale worker-events socket before
    # delegating to the official entrypoint.
    entrypoint:
      - /bin/sh
      - -ec
      - rm -f /usr/local/kong/sockets/we && exec /docker-entrypoint.sh kong docker-start
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: bundled
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      # Local QA does not need one worker per CPU; reserve memory for graph/RAG
      # compilation and the Playwright validator.
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ./infra/kong.yml:/kong/kong.yml:ro
    depends_on:
      rest:
        condition: service_started
      storage:
        condition: service_healthy
    # Do not invoke `kong health` here: Docker runs the image entrypoint for
    # CMD checks and it attempts to start a second nginx instance. The master
    # process creates this socket only after it is ready to serve requests.
    healthcheck:
      test: ["CMD-SHELL", "test -S /usr/local/kong/sockets/we"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: ${KONG_MEMORY_LIMIT:-512m}
    logging: *default-logging
    # `edge` lets the shared Caddy (prod stack) reverse-proxy into a QA
    # stack's kong even though each Compose project has its own private
    # `backend` network. Alias is project-qualified so prod and QA don't
    # collide on the same shared network.
    networks:
      backend: {}
      edge:
        aliases: ["kong-${COMPOSE_PROJECT_NAME:-brain-ai}"]

  api:
    image: ${API_IMAGE:-brain-api}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    environment:
      <<: *backend-environment
    volumes:
      - local-storage:/data/local-storage
      - vault-data:/data/vault
    depends_on:
      migrate:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-1536m}
    logging: *default-logging
    networks:
      backend: {}
      edge:
        aliases: ["api-${COMPOSE_PROJECT_NAME:-brain-ai}"]

  workers:
    image: ${API_IMAGE:-brain-api}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    command: ["python", "-m", "workers.runner", "--all"]
    environment:
      <<: *backend-environment
    volumes:
      - local-storage:/data/local-storage
      - vault-data:/data/vault
    depends_on:
      migrate:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    mem_limit: ${WORKERS_MEMORY_LIMIT:-1536m}
    logging: *default-logging
    networks: [backend]

  seed-admin:
    image: ${API_IMAGE:-brain-api}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    command: ["python", "scripts/ensure_seed_admin.py"]
    environment:
      <<: *backend-environment
      AI_BRAIN_SEED_ADMIN_EMAIL: ${AI_BRAIN_SEED_ADMIN_EMAIL:-}
      AI_BRAIN_SEED_ADMIN_USERNAME: ${AI_BRAIN_SEED_ADMIN_USERNAME:-admin}
      AI_BRAIN_SEED_ADMIN_PASSWORD: ${AI_BRAIN_SEED_ADMIN_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks: [backend]

  n8n:
    image: n8nio/n8n:1.115.0
    environment:
      N8N_HOST: ${N8N_DOMAIN:?set N8N_DOMAIN}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: "5678"
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      API_INTERNAL_BASE_URL: http://api:8080
      AI_BRAIN_WEBHOOK_TOKEN: ${AI_BRAIN_WEBHOOK_TOKEN:?set AI_BRAIN_WEBHOOK_TOKEN}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v23.0}
      GENERIC_TIMEZONE: America/Sao_Paulo
    volumes:
      - n8n-data:/home/node/.n8n
      - ./api/n8n-workflows:/workflows:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  n8n-import:
    image: n8nio/n8n:1.115.0
    command:
      - sh
      - -ec
      - |
        for workflow in /workflows/whatsapp-*.json; do
          n8n import:workflow --input="$${workflow}"
        done
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./api/n8n-workflows:/workflows:ro
    restart: "no"
    profiles: ["workflow-bootstrap"]
    logging: *default-logging
    networks: [backend]

  evolution-redis:
    image: redis:7.4-alpine
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$${EVOLUTION_REDIS_PASSWORD}\""]
    environment:
      EVOLUTION_REDIS_PASSWORD: ${EVOLUTION_REDIS_PASSWORD:-evolution-disabled}
    volumes:
      - evolution-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${EVOLUTION_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    profiles: ["evolution"]
    logging: *default-logging
    networks: [backend]

  evolution-api:
    image: ${EVOLUTION_API_IMAGE:-evoapicloud/evolution-api@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339}
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_AUTHENTICATION_API_KEY:-evolution-disabled}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution-disabled}@db:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${EVOLUTION_REDIS_PASSWORD:-evolution-disabled}@evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: brain-evolution
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#198754"
      CONFIG_SESSION_PHONE_CLIENT: Chrome
      CONFIG_SESSION_PHONE_NAME: Chrome
      NODE_OPTIONS: --dns-result-order=ipv4first
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/brain-local.pem
      DEL_INSTANCE: "false"
      LOG_LEVEL: WARN
    volumes:
      - evolution-instances:/evolution/instances
      - ${EVOLUTION_CA_BUNDLE_HOST:-./.runtime/evolution/ca.pem}:/usr/local/share/ca-certificates/brain-local.pem:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      evolution-redis:
        condition: service_healthy
    healthcheck:
      # Evolution 2.3.7 does not expose the health routes added in newer
      # releases. Probe the authenticated, read-only instance listing instead.
      test: ["CMD-SHELL", "wget -q --header=\"apikey: $${AUTHENTICATION_API_KEY}\" -O /dev/null http://127.0.0.1:8080/instance/fetchInstances || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped
    profiles: ["evolution"]
    logging: *default-logging
    networks: [backend]

  wa-validator:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.wa-validator
    environment:
      WA_VALIDATOR_RUNNER_TOKEN: ${AI_BRAIN_WEBHOOK_TOKEN:?set AI_BRAIN_WEBHOOK_TOKEN}
      WA_VALIDATOR_HEADLESS: ${WA_VALIDATOR_HEADLESS:-true}
    volumes:
      - wa-validator-runtime:/runtime
      - wa-validator-profile:/profile
      - wa-validator-artifacts:/artifacts
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    profiles: ["wa-validator"]
    logging: *default-logging
    networks: [backend]

  grafana:
    image: grafana/grafana-oss:11.3.1
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.invalid}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Soft default, not :?required -- this service sits behind the
      # "observability" profile and must not break `docker compose config`
      # (run unconditionally in CI) on a deploy that never enables it.
      # Real requiredness is enforced by validate_env.py when
      # OBSERVABILITY_ENABLED=true, the same split evolution-api uses below.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-observability-disabled}
      # Internal ops tool only -- same exposure posture as n8n's own UI,
      # which is also public-subdomain-with-login today. No self-signup,
      # no anonymous viewing.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Read-only role provisioned by migration 107 -- Grafana can only
      # SELECT from agent_logs/system_events/n8n_executions/messages/leads,
      # never write, even if the dashboard/query layer is compromised.
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    # First observability-only service in this compose file to get an
    # explicit memory cap -- the VPS stays fixed at 8GB/2vCPU (see
    # docs/VPS_PRODUCTION_RUNBOOK.md) and nothing else in the stack has
    # headroom reserved for it.
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      # grafana_reader's SELECT grants only exist after migration 107 runs
      # -- without this, a plain `docker compose --profile observability up
      # -d` (bypassing ops/vps/deploy.sh's explicit ordering) could start
      # Grafana against a schema/role that isn't ready yet.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    profiles: ["observability"]
    logging: *default-logging
    networks: [backend]

  caddy:
    image: caddy:2.8-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      API_DOMAIN_SECONDARY: ${API_DOMAIN_SECONDARY:-api-alt.localhost}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?set STORAGE_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN:?set N8N_DOMAIN}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-grafana.invalid}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      # Only set on the prod stack's .env.compose. The shared Caddy here
      # also terminates TLS for the QA stack's api/kong, reached over the
      # `edge` network by their project-qualified aliases. Default to
      # `.invalid` placeholders (RFC 2606, never resolves) so an unset value
      # still parses as a valid Caddyfile site address instead of breaking
      # every site block, including prod's, with an empty host.
      API_DOMAIN_QA: ${API_DOMAIN_QA:-qa-api.invalid}
      STORAGE_DOMAIN_QA: ${STORAGE_DOMAIN_QA:-qa-storage.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      kong:
        condition: service_healthy
      n8n:
        condition: service_started
    restart: unless-stopped
    profiles: ["edge"]
    logging: *default-logging
    networks: [backend, edge]

volumes:
  postgres-data:
  storage-data:
  local-storage:
  vault-data:
  caddy-data:
  caddy-config:
  n8n-data:
  grafana-data:
  wa-validator-runtime:
  wa-validator-profile:
  wa-validator-artifacts:
  evolution-redis-data:
  evolution-instances:

networks:
  backend:
    driver: bridge
  # Shared across the prod (`brain-ai`) and QA (`brain-ai-qa`) Compose
  # projects so the prod stack's Caddy can reverse-proxy into QA's api/kong.
  # Created once on the host with `docker network create edge` (deploy.sh
  # also creates it idempotently before bringing services up).
  edge:
    external: true
