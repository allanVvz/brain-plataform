services:
  db:
    image: pgvector/pgvector:pg16
    container_name: brain-db
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - brain_postgres_data:/var/lib/postgresql/data
      - ./docker/local-supabase/init:/docker-entrypoint-initdb.d:ro
      - ./supabase/migrations:/app/supabase/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brain"]
      interval: 5s
      timeout: 5s
      retries: 30

  rest:
    image: postgrest/postgrest:v12.2.8
    container_name: brain-postgrest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/brain
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-dev-jwt-secret-at-least-32-chars-change-me
      PGRST_DB_USE_LEGACY_GUCS: "false"
    restart: unless-stopped

  supabase-gateway:
    image: nginx:1.27-alpine
    container_name: brain-supabase-gateway
    depends_on:
      - rest
    ports:
      - "54321:8000"
    volumes:
      - ./docker/local-supabase/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain-api
    depends_on:
      db:
        condition: service_healthy
      supabase-gateway:
        condition: service_started
    environment:
      PORT: "8000"
      SUPABASE_URL: http://supabase-gateway:8000
      SUPABASE_SERVICE_KEY: ${LOCAL_SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhaS1icmFpbi1sb2NhbCIsInJlZiI6ImxvY2FsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2MDAwMDAwMCwiZXhwIjo0MTAyNDQ0ODAwfQ.v0SAbD0EDzJ4V1r_7c2O0-elmx5EoIAB50ky3ShmrNw}
      SUPABASE_SSL_VERIFY: "false"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AI_BRAIN_AUTH_SECRET: local-dev-auth-secret-change-me
      LOCAL_STORAGE_DIR: /app/local-storage
      PUBLIC_API_URL: http://localhost:8000
      VAULT_SOURCE_MODE: local
      RUN_EMBEDDED_WORKERS: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - brain_local_storage:/app/local-storage
    restart: unless-stopped

  dashboard:
    image: node:24-bookworm-slim
    container_name: brain-dashboard
    depends_on:
      - api
      - supabase-gateway
    working_dir: /app
    command: sh -c "npm install --strict-ssl=false && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NPM_CONFIG_STRICT_SSL: "false"
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${LOCAL_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhaS1icmFpbi1sb2NhbCIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAwMDAwMDAsImV4cCI6NDEwMjQ0NDgwMH0.Rkedc_mLxgOvplPbhwZvT0xCDBYnFm1hnWbcjRW8oxE}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - brain_dashboard_node_modules:/app/node_modules
      - brain_dashboard_next:/app/.next
    restart: unless-stopped

volumes:
  brain_postgres_data:
  brain_local_storage:
  brain_dashboard_node_modules:
  brain_dashboard_next:
