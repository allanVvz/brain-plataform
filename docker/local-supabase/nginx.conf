server {
  listen 8000;

  location = /health {
    add_header Content-Type application/json;
    return 200 '{"status":"ok","service":"local-supabase-gateway"}';
  }

  location /rest/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://rest:3000/;
  }
}
