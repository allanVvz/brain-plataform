name: Publish persona content

on:
  workflow_dispatch:
    inputs:
      persona_slug:
        description: Persona slug to publish
        required: true
      expected_checksum:
        description: Approved graph/document checksum
        required: true
      expected_version:
        description: Approved graph/document version
        required: true

permissions:
  contents: read

concurrency:
  group: brain-ai-content-${{ inputs.persona_slug }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production-content
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish one approved persona document
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          PERSONA_SLUG: ${{ inputs.persona_slug }}
          EXPECTED_CHECKSUM: ${{ inputs.expected_checksum }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,PERSONA_SLUG,EXPECTED_CHECKSUM,EXPECTED_VERSION
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            [[ "$PERSONA_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
            [[ "$EXPECTED_CHECKSUM" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_VERSION" =~ ^[1-9][0-9]*$ ]]
            docker compose --env-file .env.compose exec -T api \
              python scripts/publish_persona_documents.py "$PERSONA_SLUG" \
                --expected-checksum "$EXPECTED_CHECKSUM" \
                --expected-version "$EXPECTED_VERSION"
