name: Retain production release images

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed inventory (false remains read-only)
        type: boolean
        default: false
      clean_apt_metadata:
        description: Remove only the two reviewed APT metadata cache files
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

jobs:
  retain:
    runs-on: ubuntu-latest
    environment: production-cleanup
    steps:
      - name: Checkout reviewed retention script
        uses: actions/checkout@v4

      - name: Inventory exact image and stopped-container retention
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          BRAIN_RELEASE_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          RETENTION_MODE: --dry-run
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: BRAIN_RELEASE_ROOT,RETENTION_MODE
          script_path: ops/vps/retain-release-images.sh

      - name: Apply reviewed image and stopped-container retention
        if: ${{ inputs.apply }}
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          BRAIN_RELEASE_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          RETENTION_MODE: --apply
          CLEANUP_AUTHORIZED: "true"
          CLEAN_APT_METADATA: ${{ inputs.clean_apt_metadata }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: BRAIN_RELEASE_ROOT,RETENTION_MODE,CLEANUP_AUTHORIZED,CLEAN_APT_METADATA
          script_path: ops/vps/retain-release-images.sh
