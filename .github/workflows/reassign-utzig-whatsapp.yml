name: Reassign Utzig WhatsApp binding

on:
  workflow_dispatch:
    inputs:
      action:
        description: Dry-run records the exact binding plan; apply performs the reversible zero-lead move
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: utzig-whatsapp-reassignment
  cancel-in-progress: false

jobs:
  reassign:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Move one verified Meta Cloud binding without outbound traffic
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          REASSIGN_ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,REASSIGN_ACTION
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            control_slot="$(python3 -c 'import json; print(json.load(open(".deploy/microservices/slots.json", encoding="utf-8"))["control-plane"]["active"])')"
            [[ "$control_slot" == blue || "$control_slot" == green ]]
            control_service="control-plane-$control_slot"
            control_container="brain-ai-control-plane-$control_slot-1"
            [[ "$(docker inspect -f '{{.State.Health.Status}}' "$control_container")" == healthy ]]
            args=(python scripts/move_whatsapp_binding.py --from-persona-slug aurora --to-persona-slug utzig-garage --provider meta_cloud --routing preserve_agentic)
            [[ "$REASSIGN_ACTION" == apply ]] && args+=(--apply)
            docker compose --env-file .env.compose -f docker-compose.yml -f infra/microservices/docker-compose.blue-green.yml exec -T "$control_service" "${args[@]}"
