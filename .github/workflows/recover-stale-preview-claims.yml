name: Recover stale production preview claims

on:
  workflow_dispatch:
    inputs:
      action:
        description: Audit exact claims or release them to the human-review queue
        type: choice
        options: [dry-run, apply]
        default: dry-run
      persona_slug:
        description: Persona that owns the exact buffer rows
        type: choice
        options: [tock-fatal, aurora, vz-lupas]
        required: true
      buffer_ids:
        description: Comma-separated UUIDs; exact scope only
        required: true
      reason:
        description: Audit reason recorded on the recovered rows
        required: true
        default: stale operator preview claim recovery

permissions:
  contents: read

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Audit or release exact stale preview claims
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          RECOVERY_ACTION: ${{ inputs.action }}
          PERSONA_SLUG: ${{ inputs.persona_slug }}
          BUFFER_IDS: ${{ inputs.buffer_ids }}
          RECOVERY_REASON: ${{ inputs.reason }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,RECOVERY_ACTION,PERSONA_SLUG,BUFFER_IDS,RECOVERY_REASON
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            [[ "$RECOVERY_ACTION" == dry-run || "$RECOVERY_ACTION" == apply ]]
            [[ "$PERSONA_SLUG" =~ ^[a-z0-9-]+$ ]]
            [[ "$RECOVERY_REASON" =~ ^[A-Za-z0-9_.:\ -]{3,160}$ ]]
            IFS=',' read -r -a buffer_ids <<< "$BUFFER_IDS"
            ((${#buffer_ids[@]} >= 1 && ${#buffer_ids[@]} <= 10))
            declare -A seen=()
            for buffer_id in "${buffer_ids[@]}"; do
              [[ "$buffer_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              [[ -z "${seen[$buffer_id]+x}" ]] || { echo "duplicate buffer id" >&2; exit 1; }
              seen[$buffer_id]=1
            done
            expected_count="${#buffer_ids[@]}"
            compose=(docker compose --env-file .env.compose -f docker-compose.yml -f infra/microservices/docker-compose.blue-green.yml)
            psql=("${compose[@]}" exec -T
              -e "BUFFER_IDS=$BUFFER_IDS"
              -e "PERSONA_SLUG=$PERSONA_SLUG"
              -e "RECOVERY_REASON=$RECOVERY_REASON"
              db sh -c 'exec psql -v ON_ERROR_STOP=1 -v BUFFER_IDS="$BUFFER_IDS" -v PERSONA_SLUG="$PERSONA_SLUG" -v RECOVERY_REASON="$RECOVERY_REASON" -Atq -U "$POSTGRES_USER" -d "$POSTGRES_DB"')

            audit="$(printf '%s\n' "
            WITH target AS (
              SELECT b.*,p.slug AS persona_slug
                FROM public.lead_buffer b
                JOIN public.personas p ON p.id=b.persona_id
               WHERE b.id=ANY(string_to_array(:'BUFFER_IDS',',')::uuid[])
            ), checked AS (
              SELECT target.*,
                coalesce(target.payload->>'queue_preview_claim','')='true' AS has_preview_claim,
                NOT (coalesce(target.payload,'{}'::jsonb) ? 'decision_attempt_started_at') AS no_decision_attempt,
                NOT (coalesce(target.payload,'{}'::jsonb) ? 'provider_attempt_started_at') AS no_provider_attempt,
                NOT EXISTS (
                  SELECT 1 FROM public.conversation_turn_proofs proof
                   WHERE proof.canonical_inbound_id=target.id::text
                ) AS no_proof,
                NOT EXISTS (
                  SELECT 1 FROM public.lead_buffer outbound
                   WHERE outbound.direction='outbound'
                     AND outbound.lead_ref=target.lead_ref
                     AND outbound.channel_binding_id IS NOT DISTINCT FROM target.channel_binding_id
                     AND outbound.correlation_id='ai:' || coalesce(target.correlation_id,'')
                ) AS no_outbound
              FROM target
            )
            SELECT jsonb_build_object(
              'target_count',count(*),
              'eligible_count',count(*) FILTER (WHERE persona_slug=:'PERSONA_SLUG'
                AND direction='inbound' AND status='processing'
                AND locked_by='operator-preview'
                AND coalesce(locked_at,updated_at)<now()-interval '5 minutes'
                AND has_preview_claim AND no_decision_attempt AND no_provider_attempt
                AND no_proof AND no_outbound),
              'rows',coalesce(jsonb_agg(jsonb_build_object(
                'id',id,'persona_slug',persona_slug,'status',status,'locked_by',locked_by,
                'attempt_count',attempt_count,'has_preview_claim',has_preview_claim,
                'no_decision_attempt',no_decision_attempt,'no_provider_attempt',no_provider_attempt,
                'no_proof',no_proof,'no_outbound',no_outbound,
                'lead_hash',left(md5(coalesce(lead_ref::text,'')),12)
              ) ORDER BY id),'[]'::jsonb)
            )
            FROM checked;" | "${psql[@]}")"
            echo "STALE_PREVIEW_CLAIM_AUDIT=$audit"
            python3 - "$audit" "$expected_count" <<'PY'
            import json, sys
            row = json.loads(sys.argv[1])
            expected = int(sys.argv[2])
            if row.get("target_count") != expected or row.get("eligible_count") != expected:
                raise SystemExit(f"stale preview claim audit failed: {row}")
            PY
            [[ "$RECOVERY_ACTION" == apply ]] || { echo "STALE_PREVIEW_CLAIM_DRY_RUN=passed"; exit 0; }

            printf '%s\n' "
            BEGIN;
            SELECT pg_advisory_xact_lock(hashtext('claim_whatsapp_buffer:v3'));
            SELECT set_config('brain.recovery.buffer_ids', :'BUFFER_IDS', true);
            SELECT set_config('brain.recovery.persona_slug', :'PERSONA_SLUG', true);
            SELECT set_config('brain.recovery.reason', :'RECOVERY_REASON', true);
            DO \$\$
            DECLARE
              row public.lead_buffer%ROWTYPE;
              seen_count integer := 0;
              expected_count integer := array_length(string_to_array(current_setting('brain.recovery.buffer_ids'),',')::uuid[],1);
              reason text := current_setting('brain.recovery.reason');
            BEGIN
              FOR row IN
                SELECT b.*
                  FROM public.lead_buffer b
                  JOIN public.personas p ON p.id=b.persona_id
                 WHERE b.id=ANY(string_to_array(current_setting('brain.recovery.buffer_ids'),',')::uuid[])
                   AND p.slug=current_setting('brain.recovery.persona_slug')
                 ORDER BY b.id
                 FOR UPDATE
              LOOP
                seen_count := seen_count + 1;
                IF row.direction <> 'inbound' OR row.status <> 'processing'
                   OR row.locked_by <> 'operator-preview'
                   OR coalesce(row.locked_at,row.updated_at) >= now()-interval '5 minutes'
                   OR coalesce(row.payload->>'queue_preview_claim','') <> 'true'
                   OR (coalesce(row.payload,'{}'::jsonb) ? 'decision_attempt_started_at')
                   OR (coalesce(row.payload,'{}'::jsonb) ? 'provider_attempt_started_at')
                   OR EXISTS (SELECT 1 FROM public.conversation_turn_proofs proof WHERE proof.canonical_inbound_id=row.id::text)
                   OR EXISTS (
                     SELECT 1 FROM public.lead_buffer outbound
                      WHERE outbound.direction='outbound'
                        AND outbound.lead_ref=row.lead_ref
                        AND outbound.channel_binding_id IS NOT DISTINCT FROM row.channel_binding_id
                        AND outbound.correlation_id='ai:' || coalesce(row.correlation_id,'')
                   )
                THEN
                  RAISE EXCEPTION 'stale preview claim safety check failed for %', row.id;
                END IF;
                PERFORM public.release_queue_preview_claim_v1(row.id, reason);
                INSERT INTO public.system_events(event_type,entity_type,entity_id,persona_id,payload,level,source)
                VALUES ('messaging.queue.stale_preview_claim_recovered','lead_buffer',row.id::text,row.persona_id,
                  jsonb_build_object('reason',reason,'recovery_scope','exact_buffer_ids'), 'warn','messaging.queue');
              END LOOP;
              IF seen_count <> expected_count THEN
                RAISE EXCEPTION 'recovery scope changed: expected %, found %', expected_count, seen_count;
              END IF;
            END
            \$\$;
            COMMIT;
            " | "${psql[@]}"

            remaining="$(printf '%s\n' "
            SELECT jsonb_build_object(
              'target_count',count(*),
              'released_count',count(*) FILTER (WHERE status='waiting_human' AND locked_at IS NULL AND locked_by IS NULL
                AND NOT (coalesce(payload,'{}'::jsonb) ? 'queue_preview_claim'))
            )
            FROM public.lead_buffer
            WHERE id=ANY(string_to_array(:'BUFFER_IDS',',')::uuid[]);" | "${psql[@]}")"
            echo "STALE_PREVIEW_CLAIM_REMAINING=$remaining"
            python3 - "$remaining" "$expected_count" <<'PY'
            import json, sys
            row = json.loads(sys.argv[1])
            expected = int(sys.argv[2])
            if row.get("target_count") != expected or row.get("released_count") != expected:
                raise SystemExit(f"stale preview claim post-check failed: {row}")
            PY
            echo "STALE_PREVIEW_CLAIM_APPLY=passed scope=$BUFFER_IDS persona=$PERSONA_SLUG"
