name: Deploy QA VPS

# No `push` trigger on purpose: this is the feature flag. Pushing commits to
# `qa` never touches the VPS or builds/publishes an image by itself — it
# costs nothing. The stack only starts consuming VPS resources when someone
# explicitly runs this workflow with `action: up`, and stops again with
# `action: down`. See docs/runbooks/QA_PRODUCTION_ISOLATION.md, section
# "QA persistente (mesma VPS)".
on:
  workflow_dispatch:
    inputs:
      action:
        description: Bring the QA stack up, tear it down, or force an immediate prod-to-QA DB refresh
        type: choice
        options: [up, down, refresh-db]
        default: up
      ref:
        description: Branch, tag or SHA to deploy (only used for action=up)
        required: false
        default: qa
      image_tag:
        description: Existing immutable SHA tag to redeploy without rebuilding (only used for action=up)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: brain-ai-qa
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  validate:
    if: inputs.action == 'up'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r api/requirements.txt pytest

      - name: Compile backend
        run: python scripts/check_python_syntax.py

      - name: Run backend tests
        env:
          ASSET_OCR_BACKEND: mock
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_KEY: ci-local-placeholder
          SUPABASE_RETRY_ATTEMPTS: "0"
          SUPABASE_HTTP_TIMEOUT_SECONDS: "2"
          SUPABASE_OFFLINE: "true"
          KNOWLEDGE_TAXONOMY_OFFLINE: "true"
        run: >-
          python -m pytest -q
          tests/test_production_env.py
          tests/test_public_route_allowlist.py
          tests/test_graph_json_validator.py
          tests/test_approved_faq_publication_contract.py
          tests/test_aurora_appointment_runtime.py
          tests/test_seed_aurora_credentials.py
          tests/test_conversation_runtime.py
          tests/test_conversation_modes.py
          tests/test_deterministic_sdr.py
          tests/test_whatsapp_exactly_once.py
          tests/test_whatsapp_migration_contract.py
          tests/test_whatsapp_runtime.py
          api/tests/test_graph_markdown_catalog.py
          api/tests/test_lead_qualification.py
          api/tests/test_client_portal.py

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard for Vercel proxy contract
        working-directory: dashboard
        env:
          API_INTERNAL_BASE_URL: https://api-qa.example.com
          NEXT_PUBLIC_API_BASE_URL: /api-brain
        run: npm ci && npm run build

      - name: Validate QA Compose
        shell: bash
        run: |
          cp .env.compose.example .env.ci
          sed -i 's|^COMPOSE_PROJECT_NAME=.*|COMPOSE_PROJECT_NAME=brain-ai-qa|' .env.ci
          sed -i 's|^ENVIRONMENT=.*|ENVIRONMENT=production|' .env.ci
          sed -i 's|^API_DOMAIN=.*|API_DOMAIN=api-qa.example.com|' .env.ci
          sed -i 's|^STORAGE_DOMAIN=.*|STORAGE_DOMAIN=storage-qa.example.com|' .env.ci
          sed -i 's|^N8N_DOMAIN=.*|N8N_DOMAIN=n8n.example.com|' .env.ci
          sed -i 's|^ACME_EMAIL=.*|ACME_EMAIL=ops@example.com|' .env.ci
          sed -i 's|^SUPABASE_PUBLIC_URL=.*|SUPABASE_PUBLIC_URL=https://storage-qa.example.com|' .env.ci
          sed -i 's|^ALLOWED_ORIGINS=.*|ALLOWED_ORIGINS=https://dashboard-qa.example.com|' .env.ci
          sed -i 's|^AI_BRAIN_COOKIE_SECURE=.*|AI_BRAIN_COOKIE_SECURE=true|' .env.ci
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env.ci
          sed -i "s|^AI_BRAIN_AUTH_SECRET=.*|AI_BRAIN_AUTH_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env.ci
          sed -i "s|^AI_BRAIN_WEBHOOK_TOKEN=.*|AI_BRAIN_WEBHOOK_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env.ci
          python infra/generate_keys.py --write .env.ci
          EXPECTED_COMPOSE_PROJECT_NAME=brain-ai-qa python ops/vps/validate_env.py .env.ci
          IMAGE_TAG=${GITHUB_SHA} docker compose --env-file .env.ci config --quiet

  publish:
    if: inputs.action == 'up'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      repository: ${{ steps.meta.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: meta
        shell: bash
        run: |
          echo "image_tag=${{ inputs.image_tag || '' }}" >> "$GITHUB_OUTPUT"
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: inputs.image_tag == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: inputs.image_tag == ''

      - name: Publish API and worker image
        if: inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repository }}/brain-api:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Publish migration runner image
        if: inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/migrate.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repository }}/brain-migrate:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy:
    needs: [validate, publish]
    if: >-
      always() &&
      (inputs.action != 'up' || (needs.validate.result == 'success' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
        if: inputs.action == 'up'
        with:
          ref: ${{ inputs.ref }}

      - name: Synchronize deployment manifests
        if: inputs.action == 'up'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml,infra/kong.yml,ops/vps
          target: ${{ secrets.VPS_APP_DIR_QA || '/opt/brain-ai-qa' }}
          overwrite: true

      - name: Run QA action over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_APP_DIR_QA: ${{ secrets.VPS_APP_DIR_QA || '/opt/brain-ai-qa' }}
          DEPLOY_ACTION: ${{ inputs.action }}
          REQUESTED_TAG: ${{ inputs.image_tag || needs.publish.outputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USERNAME,GHCR_TOKEN,VPS_APP_DIR_QA,DEPLOY_ACTION,REQUESTED_TAG
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR_QA"
            case "$DEPLOY_ACTION" in
              up)
                printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
                bash ops/vps/deploy-qa.sh "$REQUESTED_TAG"
                bash ops/vps/audit.sh
                ;;
              down)
                bash ops/vps/qa-down.sh
                ;;
              refresh-db)
                bash ops/vps/qa-refresh-db.sh
                ;;
            esac
