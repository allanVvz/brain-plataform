name: Resume production microservice workers

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [dry-run, resume]
        default: dry-run
      authorization_reason:
        description: Reviewed reason authorizing microservice workers to resume
        required: true

permissions:
  contents: read

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read-only production readiness audit
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AUDIT_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AUDIT_ROOT
          command_timeout: 10m
          script_path: ops/vps/validate-production-release.sh
      - name: Synchronize approved resume control
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/vps/resume-microservice-workers.sh
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Validate or resume active microservice worker groups
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AUDIT_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          AUTHORIZATION_ACTOR: ${{ github.actor }}
          AUTHORIZATION_REASON: ${{ inputs.authorization_reason }}
          RESUME_ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AUDIT_ROOT,AUTHORIZATION_ACTOR,AUTHORIZATION_REASON,RESUME_ACTION
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "$AUDIT_ROOT"
            mode=--dry-run
            [[ "$RESUME_ACTION" == "resume" ]] && mode=--apply
            bash ops/vps/resume-microservice-workers.sh "$mode"
