name: Reusable microservice blue-green deployment
on:
  workflow_call:
    inputs:
      service: {required: true, type: string}
      manifest_sha: {required: true, type: string}
      manifest_path: {required: true, type: string}
      action: {required: true, type: string}
      canary_persona_slug: {required: false, type: string, default: ""}
      canary_flow_id: {required: false, type: string, default: ""}
    secrets:
      VPS_HOST: {required: true}
      VPS_USER: {required: true}
      VPS_SSH_KEY: {required: true}
      VPS_PORT: {required: false}
      VPS_APP_DIR: {required: false}
      GHCR_USERNAME: {required: false}
      GHCR_TOKEN: {required: false}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ inputs.manifest_sha }}"}
      - run: python ops/microservices/validate-release-manifest.py "${{ inputs.manifest_path }}"
      - name: Validate requested operation
        shell: bash
        run: |
          [[ "${{ inputs.service }}" =~ ^(gateway|control-plane|conversation-runtime|transport)$ ]]
          [[ "${{ inputs.action }}" =~ ^(dry-run|deploy|rollback)$ ]]

  production-preflight:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ inputs.manifest_sha }}"}
      - name: Read-only production readiness audit
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AUDIT_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          ALLOW_PENDING_MICROSERVICE_DIGESTS: "true"
          AUDIT_SCRIPT: ops/vps/validate-production-release.sh
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          envs: AUDIT_ROOT,ALLOW_PENDING_MICROSERVICE_DIGESTS,AUDIT_SCRIPT
          script: |
            set -Eeuo pipefail
            cd "$AUDIT_ROOT"
            bash "$AUDIT_SCRIPT"
            bash ops/vps/rollout-microservices.sh status

  mutate:
    needs: production-preflight
    if: inputs.action != 'dry-run'
    environment: production-${{ inputs.service }}
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.manifest_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ inputs.manifest_sha }}"}
      # A TCP dial timeout happens before a remote command receives any data.
      # Retrying this idempotent file sync once is safe; deploy/canary steps are
      # intentionally never retried because they can already have side effects.
      - name: Synchronize service release controls
        id: scp_attempt_1
        continue-on-error: true
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 120s
          source: ops/microservices/route-map.json,ops/microservices/render-active-routes.py,ops/microservices/validate-release-manifest.py,ops/vps/deploy-microservice-blue-green.sh,ops/vps/run-microservice-wa-validator.sh,${{ inputs.manifest_path }}
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Wait before retrying service-control sync
        if: steps.scp_attempt_1.outcome == 'failure'
        run: sleep 20
      - name: Synchronize service release controls (retry)
        if: steps.scp_attempt_1.outcome == 'failure'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 120s
          source: ops/microservices/route-map.json,ops/microservices/render-active-routes.py,ops/microservices/validate-release-manifest.py,ops/vps/deploy-microservice-blue-green.sh,ops/vps/run-microservice-wa-validator.sh,${{ inputs.manifest_path }}
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Deploy or rollback one service by immutable digest
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CANARY_PERSONA_SLUG: ${{ inputs.canary_persona_slug }}
          CANARY_FLOW_ID: ${{ inputs.canary_flow_id }}
          WA_VALIDATOR_TIMEOUT_SECONDS: "300"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          envs: GHCR_USERNAME,GHCR_TOKEN,CANARY_PERSONA_SLUG,CANARY_FLOW_ID,WA_VALIDATOR_TIMEOUT_SECONDS
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}"
            if [[ -n "${GHCR_TOKEN:-}" ]]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi
            # Validate the exact controls and manifest just synchronized by
            # this approved job before any container or route mutation.
            if [[ "${{ inputs.action }}" == "deploy" && "${{ inputs.service }}" == "conversation-runtime" ]]; then
              [[ -n "$CANARY_PERSONA_SLUG" && -n "$CANARY_FLOW_ID" ]] || {
                echo "runtime deploy requires an internal WA canary profile" >&2
                exit 1
              }
            fi
            bash ops/vps/deploy-microservice-blue-green.sh \
              "${{ inputs.manifest_path }}" "${{ inputs.service }}" --dry-run
            mode=--apply
            [[ "${{ inputs.action }}" == "rollback" ]] && mode=--rollback
            bash ops/vps/deploy-microservice-blue-green.sh \
              "${{ inputs.manifest_path }}" "${{ inputs.service }}" "$mode"
            if [[ "${{ inputs.action }}" == "deploy" && "${{ inputs.service }}" == "conversation-runtime" ]]; then
              if ! bash ops/vps/run-microservice-wa-validator.sh \
                --canary "$CANARY_PERSONA_SLUG" "$CANARY_FLOW_ID" cold; then
                echo "runtime canary failed; rolling back automatically" >&2
                bash ops/vps/deploy-microservice-blue-green.sh \
                  "${{ inputs.manifest_path }}" conversation-runtime --rollback
                exit 1
              fi
            fi
            if [[ "${{ inputs.action }}" == "deploy" ]]; then
              canonical=ops/microservices/release-manifest.json
              previous_manifest="$(mktemp)"
              next_manifest="${canonical}.next-${{ github.run_id }}"
              cp "$canonical" "$previous_manifest"
              cp "${{ inputs.manifest_path }}" "$next_manifest"
              mv "$next_manifest" "$canonical"
              if ! status_output="$(bash ops/vps/rollout-microservices.sh status)" \
                || [[ "$status_output" == *BEHIND* ]]; then
                cp "$previous_manifest" "$canonical"
                echo "manifest promotion verification failed; rolling back service" >&2
                bash ops/vps/deploy-microservice-blue-green.sh \
                  "${{ inputs.manifest_path }}" "${{ inputs.service }}" --rollback
                exit 1
              fi
              rm "$previous_manifest"
              printf '%s\n' "$status_output"
            fi
