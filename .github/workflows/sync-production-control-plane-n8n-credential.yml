name: Sync production control-plane n8n credential

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production-control-plane
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Synchronize credential control
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/microservices/sync-control-plane-n8n-credential.py
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Audit or synchronize redacted credential
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AUDIT_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          SYNC_ACTION: ${{ inputs.action }}
          N8N_CREDENTIAL_SYNC_AUTHORIZED: ${{ inputs.action == 'apply' && 'true' || 'false' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AUDIT_ROOT,SYNC_ACTION,N8N_CREDENTIAL_SYNC_AUTHORIZED
          script: |
            set -Eeuo pipefail
            cd "$AUDIT_ROOT"
            python3 -c 'import json; value=json.load(open(".deploy/control/claims-paused.json", encoding="utf-8")); assert value.get("paused") is True'
            mode=--dry-run
            [[ "$SYNC_ACTION" == "apply" ]] && mode=--apply
            python3 ops/microservices/sync-control-plane-n8n-credential.py "$mode"
