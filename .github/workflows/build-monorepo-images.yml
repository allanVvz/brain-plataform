name: Build monorepo service images

on:
  pull_request:
    paths: ["apps/**", "packages/**", ".github/workflows/build-monorepo-images.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", ".github/workflows/build-monorepo-images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: apps
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          base="$BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$BASE_SHA"; fi
          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if grep -Eq '^packages/|^\.github/workflows/build-monorepo-images\.yml$' <<<"$files"; then
            apps='["gateway","control-plane","conversation-runtime","transport"]'
          else
            apps="$(for app in gateway control-plane conversation-runtime transport; do
              if grep -q "^apps/$app/" <<<"$files"; then printf '%s\n' "$app"; fi
            done | jq -Rsc 'split("\n") | map(select(length > 0))')"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python scripts/check_monorepo_boundaries.py
      - run: python -m json.tool apps/conversation-runtime/n8n/persona-conversation-template.json >/dev/null

  image:
    needs: [detect, boundaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build ${{ matrix.app }} from this monorepo SHA
        id: contracts
        shell: bash
        run: |
          checksum="$(python -c "import hashlib; from pathlib import Path; digest = hashlib.sha256(); [digest.update(path.read_bytes().replace(b'\\r\\n', b'\\n')) for path in sorted(Path('packages/brain-contracts/brain_contracts').glob('*.py'))]; print('sha256:' + digest.hexdigest())")"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            BRAIN_CONTRACTS_SHA=${{ steps.contracts.outputs.checksum }}
          tags: ghcr.io/allanvvz/brain-${{ matrix.app }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.brain.contracts-checksum=${{ steps.contracts.outputs.checksum }}
      - name: Record immutable image digest
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p image-digest
          printf '%s\n' '${{ steps.build.outputs.digest }}' > "image-digest/${{ matrix.app }}.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: image-digest-${{ matrix.app }}
          path: image-digest/${{ matrix.app }}.txt
          if-no-files-found: error
