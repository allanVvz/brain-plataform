name: Build monorepo service images

on:
  workflow_dispatch:
    inputs:
      services:
        description: Comma-separated services to build; must match the changed paths
        required: true
  pull_request:
    paths: ["apps/**", "packages/**", ".github/workflows/build-monorepo-images.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", ".github/workflows/build-monorepo-images.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-services-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - id: apps
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            apps="$(printf '%s' '${{ inputs.services }}' | jq -Rc 'split(",") | map(select(length > 0))')"
            python -c 'import json,sys; allowed={"gateway","control-plane","conversation-runtime","transport"}; values=json.loads(sys.argv[1]); assert values and len(values)==len(set(values)) and set(values)<=allowed' "$apps"
            echo "apps=$apps" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$BASE_SHA"; fi
          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          mapfile -t changed_paths <<<"$files"
          apps="$(python ops/microservices/affected-services.py "${changed_paths[@]}")"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python scripts/check_monorepo_boundaries.py

  image:
    needs: [detect, boundaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build ${{ matrix.app }} from this monorepo SHA
        id: contracts
        shell: bash
        run: |
          checksum="$(python -c "import hashlib; from pathlib import Path; digest = hashlib.sha256(); [digest.update(path.read_bytes().replace(b'\\r\\n', b'\\n')) for path in sorted(Path('packages/brain-contracts/brain_contracts').glob('*.py'))]; print('sha256:' + digest.hexdigest())")"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Reuse an existing immutable service revision
        id: existing
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/allanvvz/brain-${{ matrix.app }}:${{ github.sha }}" \
            --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        id: build
        if: github.event_name == 'pull_request' || steps.existing.outputs.found != 'true'
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            BRAIN_CONTRACTS_SHA=${{ steps.contracts.outputs.checksum }}
          tags: ghcr.io/allanvvz/brain-${{ matrix.app }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.brain.contracts-checksum=${{ steps.contracts.outputs.checksum }}
      - name: Record immutable image digest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p image-digest
          digest='${{ steps.existing.outputs.digest }}'
          [[ -n "$digest" ]] || digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > "image-digest/${{ matrix.app }}.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-digest-${{ matrix.app }}
          path: image-digest/${{ matrix.app }}.txt
          if-no-files-found: error
      - name: Smoke-test deployable application import
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          docker run --rm --entrypoint python \
            "ghcr.io/allanvvz/brain-${{ matrix.app }}:${{ github.sha }}" \
            -c "import main; assert hasattr(main, 'app')"
      - name: Smoke-test baked runtime embeddings without network
        if: github.event_name != 'pull_request' && matrix.app == 'conversation-runtime'
        shell: bash
        run: |
          docker run --rm --network none --entrypoint python \
            "ghcr.io/allanvvz/brain-conversation-runtime:${{ github.sha }}" \
            -c "from services.graph_compiler_v3 import generate_embeddings; assert len(generate_embeddings(['offline-cache-check'], input_type='query')) == 1"
