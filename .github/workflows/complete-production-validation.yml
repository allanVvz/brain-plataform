name: Record optional production validation

on:
  workflow_dispatch:
    inputs:
      validator_session_id:
        description: Passed internal WA Validator session recorded as optional evidence
        required: true

permissions:
  contents: read

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record evidence or complete soak
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          VALIDATOR_SESSION_ID: ${{ inputs.validator_session_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,VALIDATOR_SESSION_ID
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            bash ops/vps/audit.sh
            bash ops/vps/complete-production-validation.sh \
              record-validator "$VALIDATOR_SESSION_ID"
