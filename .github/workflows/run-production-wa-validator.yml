name: Run production WA Validator

on:
  workflow_dispatch:
    inputs:
      persona_slug:
        description: Persona validated through the internal direct driver
        type: choice
        options: [tock-fatal, aurora]
        required: true
      flow_id:
        description: Semantic validator flow compatible with the persona
        required: true
      initial_state:
        description: Initial qualification state
        type: choice
        options: [cold, known_name]
        default: cold
      action:
        description: Validate prerequisites, run, or inspect one terminal session
        type: choice
        options: [dry-run, run, inspect]
        default: dry-run
      session_id:
        description: Existing terminal session UUID (required only for inspect)
        required: false

permissions:
  contents: read

concurrency:
  group: brain-ai-production-validator
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Synchronize approved validator control
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/vps/run-microservice-wa-validator.sh
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Run internal direct validation
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          PERSONA_SLUG: ${{ inputs.persona_slug }}
          FLOW_ID: ${{ inputs.flow_id }}
          INITIAL_STATE: ${{ inputs.initial_state }}
          VALIDATOR_ACTION: ${{ inputs.action }}
          VALIDATOR_SESSION_ID: ${{ inputs.session_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,PERSONA_SLUG,FLOW_ID,INITIAL_STATE,VALIDATOR_ACTION,VALIDATOR_SESSION_ID
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            mode=--dry-run
            [[ "$VALIDATOR_ACTION" == "run" ]] && mode=--run
            [[ "$VALIDATOR_ACTION" == "inspect" ]] && mode=--inspect
            bash ops/vps/run-microservice-wa-validator.sh \
              "$mode" "$PERSONA_SLUG" "$FLOW_ID" "$INITIAL_STATE" \
              "$VALIDATOR_SESSION_ID"
