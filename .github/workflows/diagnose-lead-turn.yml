name: Diagnose one lead turn (read-only)

on:
  workflow_dispatch:
    inputs:
      persona_slug:
        description: Persona that owns the lead
        type: choice
        options: [utzig-garage, tock-fatal, aurora, vz-lupas]
        required: true
      lead_ref:
        description: Exact numeric lead id
        required: true
      window_start:
        description: Inclusive UTC window start (ISO 8601)
        required: true

permissions:
  contents: read

concurrency:
  group: brain-ai-production-read-only
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Report one lead's canonical turn trail without message text or phone numbers
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          PERSONA_SLUG: ${{ inputs.persona_slug }}
          LEAD_REF: ${{ inputs.lead_ref }}
          WINDOW_START: ${{ inputs.window_start }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          envs: VPS_APP_DIR,PERSONA_SLUG,LEAD_REF,WINDOW_START
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            [[ "$PERSONA_SLUG" =~ ^(utzig-garage|tock-fatal|aurora|vz-lupas)$ ]]
            [[ "$LEAD_REF" =~ ^[0-9]{1,12}$ ]]
            [[ "$WINDOW_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$ ]]
            compose=(docker compose --env-file .env.compose -f docker-compose.yml -f infra/microservices/docker-compose.blue-green.yml)
            "${compose[@]}" exec -T \
              -e PGOPTIONS='-c default_transaction_read_only=on' \
              -e PERSONA_SLUG="$PERSONA_SLUG" -e LEAD_REF="$LEAD_REF" -e WINDOW_START="$WINDOW_START" \
              db sh -c 'psql -v ON_ERROR_STOP=1 -v PERSONA_SLUG="$PERSONA_SLUG" -v LEAD_REF="$LEAD_REF" -v WINDOW_START="$WINDOW_START" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|"' <<'SQL'
            select 'LEAD_STATE', l.id, l.ai_paused, to_jsonb(l)->>'handoff_level', l.updated_at
            from public.leads l join public.personas p on p.id = l.persona_id
            where p.slug = :'PERSONA_SLUG' and l.id = :'LEAD_REF'::bigint;

            select 'LEAD_BUFFER', b.id, b.direction, b.status, b.created_at, b.updated_at,
                   coalesce(b.payload->'conversation_commit'->>'status', ''),
                   md5(coalesce(b.correlation_id, '')) ,
                   (select string_agg(k, ',' order by k) from jsonb_object_keys(coalesce(b.payload, '{}'::jsonb)) k)
            from public.lead_buffer b join public.personas p on p.id = b.persona_id
            where p.slug = :'PERSONA_SLUG' and b.lead_ref = :'LEAD_REF'::bigint
              and b.created_at >= :'WINDOW_START'::timestamptz
            order by b.created_at;

            select 'TURN_PROOF', t.canonical_inbound_id, t.created_at, coalesce(t.outbound_id, ''),
                   coalesce(t.final_decision->>'state', ''), coalesce((t.proof_result->>'valid'), '')
            from public.conversation_turn_proofs t
            where t.canonical_inbound_id in (
              select b.id::text from public.lead_buffer b join public.personas p on p.id = b.persona_id
              where p.slug = :'PERSONA_SLUG' and b.lead_ref = :'LEAD_REF'::bigint
                and b.created_at >= :'WINDOW_START'::timestamptz
            ) order by t.created_at;

            select 'LEAD_EVENT', e.created_at, e.event_type, e.entity_type, e.entity_id,
                   left(regexp_replace(coalesce(
                     (select jsonb_object_agg(k, v) from jsonb_each(coalesce(e.payload, '{}'::jsonb)) as x(k, v)
                       where k in ('failed_step','stage','reason','reason_class','code','error','detail','hint','state','status','action','original_sqlstate','message')
                     )::text, ''), '[0-9]{9,}', '#', 'g'), 700)
            from public.system_events e
            where e.created_at >= :'WINDOW_START'::timestamptz
              and (e.entity_id in (
                     select b.id::text from public.lead_buffer b join public.personas p on p.id = b.persona_id
                     where p.slug = :'PERSONA_SLUG' and b.lead_ref = :'LEAD_REF'::bigint
                       and b.created_at >= :'WINDOW_START'::timestamptz)
                   or (e.entity_type = 'lead' and e.entity_id = :'LEAD_REF'))
            order by e.created_at;
            SQL
