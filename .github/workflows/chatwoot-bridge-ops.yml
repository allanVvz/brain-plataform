name: Chatwoot bridge operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read protected configuration status or enable the bridge source flag
        required: true
        type: choice
        options: [inspect, enable, clean-apt-cache, prune-build-cache, set-callback, refresh-transport-config]
        default: inspect

permissions:
  contents: read

concurrency:
  group: chatwoot-bridge-ops
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect or enable protected Chatwoot bridge configuration
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          CHATWOOT_OPS_MODE: ${{ inputs.operation }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          envs: CHATWOOT_OPS_MODE
          script: |
            set -Eeuo pipefail
            [[ "$CHATWOOT_OPS_MODE" == inspect || "$CHATWOOT_OPS_MODE" == enable || "$CHATWOOT_OPS_MODE" == clean-apt-cache || "$CHATWOOT_OPS_MODE" == prune-build-cache || "$CHATWOOT_OPS_MODE" == set-callback || "$CHATWOOT_OPS_MODE" == refresh-transport-config ]]
            cd "${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}"
            python3 - "$CHATWOOT_OPS_MODE" <<'PY'
            import os, pathlib, shutil, stat, sys, time

            root = pathlib.Path.cwd()
            mode = sys.argv[1]
            env_file = root / '.env.compose'
            lines = env_file.read_text(encoding='utf-8').splitlines()
            values = {}
            for line in lines:
                stripped = line.strip()
                if stripped and not stripped.startswith('#') and '=' in stripped:
                    key, value = stripped.split('=', 1)
                    values[key.strip()] = value.strip().strip('"\'')
            required = (
                'CHATWOOT_BASE_URL', 'CHATWOOT_API_ACCESS_TOKEN',
                'CHATWOOT_ACCOUNT_ID', 'CHATWOOT_INBOX_ID',
                'CHATWOOT_INBOX_IDENTIFIER', 'CHATWOOT_BRIDGE_BINDING_ID',
                'CHATWOOT_WEBHOOK_SECRET', 'CHATWOOT_AGENT_ID',
            )
            if mode == 'inspect':
                print('bridge_source_enabled=' + str(values.get('CHATWOOT_BRIDGE_ENABLED', '').lower() in {'1','true','yes'}).lower())
                print('required_settings_present=' + str(all(values.get(key) for key in required)).lower())
                print('required_setting_count=' + str(sum(bool(values.get(key)) for key in required)) + '/' + str(len(required)))
                transport_env = root / '.env.microservices/transport.env'
                env_values = {}
                if transport_env.is_file():
                    for line in transport_env.read_text(encoding='utf-8').splitlines():
                        if '=' in line:
                            key, value = line.split('=', 1)
                            env_values[key] = value.strip().strip('"\'')
                print('transport_env_bridge_enabled=' + str(env_values.get('CHATWOOT_BRIDGE_ENABLED', '').lower() in {'1','true','yes'}).lower())
                sys.exit(0)
            if mode == 'clean-apt-cache':
                for candidate in (pathlib.Path('/var/cache/apt/pkgcache.bin'), pathlib.Path('/var/cache/apt/srcpkgcache.bin')):
                    if not candidate.exists():
                        print(f'apt_cache_already_absent={candidate.name}')
                        continue
                    if candidate.is_symlink() or not candidate.is_file() or candidate.resolve(strict=True) != candidate:
                        raise SystemExit(f'refusing unexpected APT cache path: {candidate}')
                    size = candidate.stat().st_size
                    candidate.unlink()
                    print(f'apt_cache_removed={candidate.name} bytes={size}')
                sys.exit(0)
            if mode == 'prune-build-cache':
                print('build_cache_prune_requested=true')
                sys.exit(0)
            if mode == 'set-callback':
                print('chatwoot_callback_change_requested=true')
                sys.exit(0)
            if mode == 'refresh-transport-config':
                print('transport_config_refresh_requested=true')
                sys.exit(0)
            missing = [key for key in required if not values.get(key)]
            if missing:
                raise SystemExit('required bridge settings missing: ' + ','.join(missing))
            backup_dir = pathlib.Path('/var/backups/brain-ai/chatwoot-bridge-config')
            backup_dir.mkdir(parents=True, exist_ok=True, mode=0o700)
            os.chmod(backup_dir, 0o700)
            backup = backup_dir / f'env.compose.{int(time.time())}.bak'
            shutil.copy2(env_file, backup)
            os.chmod(backup, 0o600)
            output = []
            replaced = False
            for line in lines:
                if line.strip().startswith('CHATWOOT_BRIDGE_ENABLED='):
                    output.append('CHATWOOT_BRIDGE_ENABLED=true')
                    replaced = True
                else:
                    output.append(line)
            if not replaced:
                output.append('CHATWOOT_BRIDGE_ENABLED=true')
            temporary = env_file.with_suffix('.compose.chatwoot.tmp')
            temporary.write_text('\n'.join(output) + '\n', encoding='utf-8')
            os.chmod(temporary, stat.S_IMODE(env_file.stat().st_mode))
            os.replace(temporary, env_file)
            os.chown(env_file, 0, 0)
            import subprocess
            subprocess.run(['python3', 'ops/microservices/bootstrap-service-envs.py'], check=True)
            print('bridge_source_enabled=true')
            print('protected_backup_created=true')
            print('service_envs_refreshed=true')
            PY
            if [[ "$CHATWOOT_OPS_MODE" == prune-build-cache ]]; then
              before="$(docker system df --format '{{.Type}}:{{.Reclaimable}}' | grep '^Build Cache:' || true)"
              docker builder prune --force >/dev/null
              after="$(docker system df --format '{{.Type}}:{{.Reclaimable}}' | grep '^Build Cache:' || true)"
              printf 'build_cache_reclaimable_before=%s\n' "${before#*:}"
              printf 'build_cache_reclaimable_after=%s\n' "${after#*:}"
              df -P / | awk 'NR==2 {printf "root_disk_usage=%s available_kb=%s\n", $5, $4}'
              exit 0
            fi
            if [[ "$CHATWOOT_OPS_MODE" == refresh-transport-config ]]; then
              active_slot="$(python3 -c 'import json; print(json.load(open(".deploy/microservices/slots.json", encoding="utf-8"))["transport"]["active"])')"
              [[ "$active_slot" == blue || "$active_slot" == green ]]
              backup_dir=/var/backups/brain-ai/chatwoot-bridge-config
              install -d -m 700 "$backup_dir"
              cp --preserve=mode .env.microservices/transport.env "$backup_dir/transport.env.$(date -u +%Y%m%dT%H%M%SZ).bak"
              chmod 600 "$backup_dir"/transport.env.*.bak
              python3 - <<'PY'
            import os, pathlib, stat
            source = pathlib.Path('.env.compose')
            target = pathlib.Path('.env.microservices/transport.env')
            keys = (
                'CHATWOOT_BRIDGE_ENABLED', 'CHATWOOT_BASE_URL', 'CHATWOOT_API_ACCESS_TOKEN',
                'CHATWOOT_ACCOUNT_ID', 'CHATWOOT_INBOX_ID', 'CHATWOOT_INBOX_IDENTIFIER',
                'CHATWOOT_BRIDGE_BINDING_ID', 'CHATWOOT_WEBHOOK_SECRET', 'CHATWOOT_AGENT_ID',
            )
            def parse(path):
                values = {}
                for raw in path.read_text(encoding='utf-8').splitlines():
                    line = raw.strip()
                    if not line or line.startswith('#') or '=' not in line:
                        continue
                    key, value = line.split('=', 1)
                    value = value.strip()
                    if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                        value = value[1:-1]
                    values[key.strip()] = value
                return values
            source_values = parse(source)
            if not all(source_values.get(key) for key in keys):
                raise SystemExit('protected Chatwoot source settings are incomplete')
            existing = target.read_text(encoding='utf-8').splitlines()
            updated, seen = [], set()
            for line in existing:
                key = line.split('=', 1)[0] if '=' in line else ''
                if key in keys:
                    updated.append(f'{key}={source_values[key]}')
                    seen.add(key)
                else:
                    updated.append(line)
            for key in keys:
                if key not in seen:
                    updated.append(f'{key}={source_values[key]}')
            temporary = target.with_suffix('.env.chatwoot.tmp')
            temporary.write_text('\n'.join(updated) + '\n', encoding='utf-8')
            os.chmod(temporary, stat.S_IMODE(target.stat().st_mode))
            os.chown(temporary, target.stat().st_uid, target.stat().st_gid)
            os.replace(temporary, target)
            print('chatwoot_transport_settings_written=true')
            PY
              python3 - <<'PY'
            from pathlib import Path
            values = {}
            for line in Path('.env.microservices/transport.env').read_text(encoding='utf-8').splitlines():
                if '=' in line:
                    key, value = line.split('=', 1)
                    values[key] = value.strip().strip('"\'')
            required = (
                'CHATWOOT_BASE_URL', 'CHATWOOT_API_ACCESS_TOKEN', 'CHATWOOT_ACCOUNT_ID',
                'CHATWOOT_INBOX_ID', 'CHATWOOT_INBOX_IDENTIFIER', 'CHATWOOT_BRIDGE_BINDING_ID',
                'CHATWOOT_WEBHOOK_SECRET', 'CHATWOOT_AGENT_ID',
            )
            enabled = values.get('CHATWOOT_BRIDGE_ENABLED', '').lower() in {'1', 'true', 'yes'}
            present = all(values.get(key) for key in required)
            print(f'transport_env_bridge_enabled={str(enabled).lower()}')
            print(f'transport_env_required_settings_present={str(present).lower()}')
            if not enabled or not present:
                raise SystemExit('protected Chatwoot transport environment is incomplete')
            PY
              eval "$(python3 - <<'PY'
            import json, shlex
            from pathlib import Path
            manifest = json.loads(Path('ops/microservices/release-manifest.json').read_text(encoding='utf-8'))
            values = {
                'BRAIN_CONTRACTS_VERSION': manifest['contracts_version'],
                'BRAIN_CONTRACTS_SHA': manifest['contracts_checksum'],
                'REQUIRED_SCHEMA_VERSION': manifest['services']['transport']['required_schema_version'],
                'CURRENT_SCHEMA_VERSION': manifest['services']['transport']['required_schema_version'],
                'GATEWAY_SHA': manifest['services']['gateway']['sha'],
                'GATEWAY_DIGEST': manifest['services']['gateway']['digest'],
                'CONTROL_PLANE_SHA': manifest['services']['control-plane']['sha'],
                'CONTROL_PLANE_DIGEST': manifest['services']['control-plane']['digest'],
                'RUNTIME_SHA': manifest['services']['conversation-runtime']['sha'],
                'RUNTIME_DIGEST': manifest['services']['conversation-runtime']['digest'],
                'TRANSPORT_SHA': manifest['services']['transport']['sha'],
                'TRANSPORT_DIGEST': manifest['services']['transport']['digest'],
                'GATEWAY_IMAGE_BLUE': 'ghcr.io/allanvvz/brain-gateway@' + manifest['services']['gateway']['digest'],
                'GATEWAY_IMAGE_GREEN': 'ghcr.io/allanvvz/brain-gateway@' + manifest['services']['gateway']['digest'],
                'CONTROL_PLANE_IMAGE_BLUE': 'ghcr.io/allanvvz/brain-control-plane@' + manifest['services']['control-plane']['digest'],
                'CONTROL_PLANE_IMAGE_GREEN': 'ghcr.io/allanvvz/brain-control-plane@' + manifest['services']['control-plane']['digest'],
                'RUNTIME_IMAGE_BLUE': 'ghcr.io/allanvvz/brain-conversation-runtime@' + manifest['services']['conversation-runtime']['digest'],
                'RUNTIME_IMAGE_GREEN': 'ghcr.io/allanvvz/brain-conversation-runtime@' + manifest['services']['conversation-runtime']['digest'],
                'TRANSPORT_IMAGE_BLUE': 'ghcr.io/allanvvz/brain-transport@' + manifest['services']['transport']['digest'],
                'TRANSPORT_IMAGE_GREEN': 'ghcr.io/allanvvz/brain-transport@' + manifest['services']['transport']['digest'],
                'GATEWAY_ENV_FILE': '.env.microservices/gateway.env',
                'CONTROL_PLANE_ENV_FILE': '.env.microservices/control-plane.env',
                'RUNTIME_ENV_FILE': '.env.microservices/runtime.env',
                'TRANSPORT_ENV_FILE': '.env.microservices/transport.env',
            }
            for key, value in values.items():
                print('export ' + key + '=' + shlex.quote(str(value)))
            PY
              )"
              compose=(docker compose --env-file .env.compose -f docker-compose.yml -f infra/microservices/docker-compose.blue-green.yml)
              "${compose[@]}" config --quiet
              "${compose[@]}" up -d --no-deps --force-recreate \
                "transport-$active_slot" "transport-dispatch-$active_slot" "transport-media-$active_slot"
              for attempt in $(seq 1 30); do
                if docker inspect -f '{{.State.Running}}' "brain-ai-transport-$active_slot-1" 2>/dev/null | grep -qx true; then
                  break
                fi
                sleep 2
              done
              docker exec "brain-ai-transport-$active_slot-1" python -c \
                'from services.chatwoot_api import configurations; assert configurations(); print("bridge_runtime_configured=true")'
              docker ps --format '{{.Names}}\t{{.Status}}' | grep -E "^brain-ai-transport(-dispatch|-media)?-$active_slot-1[[:space:]]"
              exit 0
            fi
            if [[ "$CHATWOOT_OPS_MODE" == inspect ]]; then
              active_transport_slot="$(python3 -c 'import json; print(json.load(open(".deploy/microservices/slots.json", encoding="utf-8"))["transport"]["active"])')"
              docker exec "brain-ai-transport-$active_transport_slot-1" python -c \
                'import os; print("transport_container_bridge_enabled=" + str((os.getenv("CHATWOOT_BRIDGE_ENABLED") or "").strip().lower() in {"1", "true", "yes"}).lower())'
              docker exec -i "brain-ai-transport-$active_transport_slot-1" python - <<'PY'
            from services import chatwoot_api, supabase_client
            try:
                config = next(iter(chatwoot_api.configurations()), None)
                if config is None:
                    raise RuntimeError('bridge disabled')
                binding = supabase_client.get_workflow_binding_by_id(config.binding_id)
                if not binding or not binding.get('active') or binding.get('provider') != 'meta_cloud' or not binding.get('whatsapp_phone_number_id'):
                    raise RuntimeError('binding inactive')
                client = chatwoot_api.ChatwootApi(config)
                try:
                    inboxes = client._request('GET', f'/api/v1/accounts/{config.account_id}/inboxes')
                finally:
                    client.close()
                if isinstance(inboxes, dict):
                    inboxes = inboxes.get('payload') or inboxes.get('inboxes') or []
                if not any(int(inbox.get('id') or 0) == config.inbox_id for inbox in inboxes if isinstance(inbox, dict)):
                    raise RuntimeError('inbox unavailable to API token')
                print('meta_binding_active=true')
                print('chatwoot_api_auth=ok')
                print('chatwoot_api_inbox_access=ok')
            except Exception as exc:
                print('bridge_probe_failed=' + type(exc).__name__)
                raise SystemExit(1)
            PY
              docker exec chatwoot-web-1 bundle exec rails runner -e production \
                'inbox=Inbox.find_by!(name: "Tock Fatal WhatsApp"); channel=inbox.channel; puts "chatwoot_inbox_id=#{inbox.id}"; puts "chatwoot_account_id=#{inbox.account_id}"; puts "chatwoot_channel_type=#{channel.class.name}"; puts "chatwoot_callback_state=#{channel.webhook_url.blank? ? "blank" : channel.webhook_url == "https://lpapi.vzforeal.com/webhooks/chatwoot" ? "expected" : "other"}"'
            fi
            if [[ "$CHATWOOT_OPS_MODE" == set-callback ]]; then
              previous_callback="$(docker exec chatwoot-web-1 bundle exec rails runner -e production \
                'i=Inbox.find_by!(name: "Tock Fatal WhatsApp"); c=i.channel; abort unless i.id == 1 && i.account_id == 1 && c.is_a?(Channel::Api); puts "CHATWOOT_CALLBACK_VALUE=#{c.webhook_url}"' | sed -n 's/^CHATWOOT_CALLBACK_VALUE=//p' | tail -n 1)"
              [[ -z "$previous_callback" || "$previous_callback" == 'https://lpapi.vzforeal.com/webhooks/chatwoot' ]] || {
                echo 'refusing to replace an unexpected Chatwoot inbox callback' >&2
                exit 1
              }
              backup_dir=/var/backups/brain-ai/chatwoot-bridge-config
              install -d -m 700 "$backup_dir"
              CHATWOOT_PREVIOUS_CALLBACK="$previous_callback" python3 - "$backup_dir/inbox-1-callback.$(date -u +%Y%m%dT%H%M%SZ).json" <<'PY'
            import json, os, pathlib, sys
            target = pathlib.Path(sys.argv[1])
            target.write_text(json.dumps({"account_id": 1, "inbox_id": 1, "previous_callback": os.environ["CHATWOOT_PREVIOUS_CALLBACK"]}) + "\n", encoding="utf-8")
            target.chmod(0o600)
            PY
              docker exec chatwoot-web-1 bundle exec rails runner -e production \
                'i=Inbox.find_by!(name: "Tock Fatal WhatsApp"); abort unless i.id == 1 && i.account_id == 1 && i.channel.is_a?(Channel::Api); i.channel.update!(webhook_url: "https://lpapi.vzforeal.com/webhooks/chatwoot"); abort unless i.channel.reload.webhook_url == "https://lpapi.vzforeal.com/webhooks/chatwoot"; puts "chatwoot_callback_state=expected"'
              echo 'protected_callback_backup_created=true'
            fi
            printf 'hostname='; hostname
            printf 'identity='; id -un
            df -P / | awk 'NR==2 {printf "root_disk_usage=%s available_kb=%s\n", $5, $4}'
            if [[ -s .deploy/microservices/slots.json ]]; then
              python3 - <<'PY'
            import json
            from pathlib import Path
            data = json.loads(Path('.deploy/microservices/slots.json').read_text())
            for name in ('gateway', 'transport'):
                print(f'{name}_active_slot={data.get(name, {}).get("active", "unknown")}')
            PY
            fi
            if [[ "$CHATWOOT_OPS_MODE" == inspect ]]; then
              active_dispatch_slot="$(python3 -c 'import json; print(json.load(open(".deploy/microservices/slots.json", encoding="utf-8"))["transport"]["active"])')"
              active_gateway_slot="$(python3 -c 'import json; print(json.load(open(".deploy/microservices/slots.json", encoding="utf-8"))["gateway"]["active"])')"
              docker exec "brain-ai-gateway-$active_gateway_slot-1" python -c \
                'import os; print("south_crm_api_enabled=" + str((os.getenv("AKIA_CRM_ENABLED") or "").strip().lower() in {"1", "true", "yes"}).lower())'
              docker top "brain-ai-transport-dispatch-$active_dispatch_slot-1" -eo pid,args | python3 -c \
                'import sys; rows=[x for x in sys.stdin if "workers.runner" in x and "chatwoot_bridge" in x]; print("chatwoot_worker_process_count=" + str(len(rows)))'
              docker inspect -f '{{json .Config.Cmd}}' "brain-ai-transport-dispatch-$active_dispatch_slot-1" | python3 -c \
                'import json,sys; cmd=" ".join(json.load(sys.stdin) or []); print("dispatch_command_includes_chatwoot_worker=" + str("chatwoot_bridge" in cmd).lower())'
              docker logs --since 15m "brain-ai-transport-dispatch-$active_dispatch_slot-1" 2>&1 | python3 -c "import sys; lines=[line for line in sys.stdin if 'ChatwootBridgeWorker' in line]; print('chatwoot_worker_started=' + str(any('started' in line for line in lines)).lower()); print('chatwoot_worker_recent_error_count=' + str(sum('[ERROR]' in line for line in lines))); print('chatwoot_worker_recovered=' + str(any('recovered after' in line for line in lines)).lower())"
            fi
            docker ps --format '{{.Names}}\t{{.Status}}' | grep -E '^(brain-ai-(gateway|transport|chatwoot)|chatwoot[-_])' || true
            if docker compose --env-file .env.compose ps --services --status running | grep -qx db; then
              migration_count="$(docker compose --env-file .env.compose exec -T db sh -c \
                'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "select count(*) from public._compose_migrations where filename = '\''164_chatwoot_api_bridge.sql'\''"')"
              [[ "$migration_count" == 1 ]] && echo 'migration_164=applied' || echo 'migration_164=missing'
            fi
