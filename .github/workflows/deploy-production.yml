name: Deploy production VPS

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy the selected image or roll back to the recorded previous image
        type: choice
        options: [deploy, rollback, inspect_lifecycle, inspect_graph_bundle, preflight_pause, postflight_validate]
        default: deploy
      candidate_sha:
        description: Full release SHA for the controlled production gate
        required: false
      image_tag:
        description: Existing immutable SHA tag (optional; current commit for deploy, recorded previous for rollback)
        required: false
      base_sha:
        description: Previously deployed full SHA used for automatic impact classification (optional; defaults to parent commit)
        required: false
      supersede_unfinished_release:
        description: Archive and supersede the current paused post-cutover lifecycle after explicit review
        type: boolean
        default: false
      supersede_reason:
        description: Required reason when superseding an unfinished post-cutover lifecycle
        required: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  TARGET_SHA: ${{ github.sha }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      class: ${{ steps.impact.outputs.class }}
      touch_vps: ${{ steps.impact.outputs.touch_vps }}
      publish_api: ${{ steps.impact.outputs.publish_api }}
      publish_worker: ${{ steps.impact.outputs.publish_worker }}
      publish_migrate: ${{ steps.impact.outputs.publish_migrate }}
      pause_claims: ${{ steps.impact.outputs.pause_claims }}
      backup: ${{ steps.impact.outputs.backup }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Classify release impact
        id: impact
        shell: bash
        env:
          REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
          DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
        run: |
          set -Eeuo pipefail
          if [ "$DEPLOY_ACTION" = "inspect_lifecycle" ] || [ "$DEPLOY_ACTION" = "inspect_graph_bundle" ] || [ "$DEPLOY_ACTION" = "preflight_pause" ] || [ "$DEPLOY_ACTION" = "postflight_validate" ]; then
            for value in class=documentation touch_vps=false publish_api=false publish_worker=false publish_migrate=false pause_claims=false backup=false; do
              echo "$value" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          if [ "$DEPLOY_ACTION" = "rollback" ]; then
            for value in class=migration touch_vps=true publish_api=false publish_worker=false publish_migrate=false pause_claims=true backup=false; do
              echo "$value" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          base="$REQUESTED_BASE_SHA"
          if [ -z "$base" ]; then base="$(git rev-parse "${TARGET_SHA}^")"; fi
          git cat-file -e "${base}^{commit}"
          python scripts/classify_deploy_impact.py --base "$base" --head "$TARGET_SHA" --github-output "$GITHUB_OUTPUT"

  validate:
    needs: classify
    if: inputs.action == 'rollback' || needs.classify.outputs.touch_vps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Require successful CI for this SHA
        if: inputs.action != 'rollback'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          conclusion="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&event=push&per_page=10" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "missing"')"
          if [ "$conclusion" != "success" ]; then
            echo "Successful CI is required for ${TARGET_SHA}; found: ${conclusion}" >&2
            exit 1
          fi

      - name: Recheck dependency-free release contracts
        if: inputs.action != 'rollback'
        run: |
          python scripts/check_python_syntax.py
          python scripts/check_persona_hardcodes.py
          python -m json.tool api/n8n-workflows/persona-conversation-template.json >/dev/null

      - name: Validate production Compose
        shell: bash
        run: |
          cp .env.compose.example .env.ci
          sed -i 's|^ENVIRONMENT=.*|ENVIRONMENT=production|' .env.ci
          sed -i 's|^API_DOMAIN=.*|API_DOMAIN=api.example.com|' .env.ci
          sed -i 's|^API_DOMAIN_SECONDARY=.*|API_DOMAIN_SECONDARY=api-alt.example.com|' .env.ci
          sed -i 's|^STORAGE_DOMAIN=.*|STORAGE_DOMAIN=storage.example.com|' .env.ci
          sed -i 's|^N8N_DOMAIN=.*|N8N_DOMAIN=n8n.example.com|' .env.ci
          sed -i 's|^ACME_EMAIL=.*|ACME_EMAIL=ops@example.com|' .env.ci
          sed -i 's|^SUPABASE_PUBLIC_URL=.*|SUPABASE_PUBLIC_URL=https://storage.example.com|' .env.ci
          sed -i 's|^ALLOWED_ORIGINS=.*|ALLOWED_ORIGINS=https://dashboard.example.com|' .env.ci
          sed -i 's|^API_INTERNAL_BASE_URL=.*|API_INTERNAL_BASE_URL=https://api.example.com|' .env.ci
          sed -i 's|^AI_BRAIN_COOKIE_SECURE=.*|AI_BRAIN_COOKIE_SECURE=true|' .env.ci
          sed -i 's|^N8N_PROTOCOL=.*|N8N_PROTOCOL=https|' .env.ci
          sed -i 's|^N8N_EDITOR_BASE_URL=.*|N8N_EDITOR_BASE_URL=https://n8n.example.com|' .env.ci
          sed -i 's|^N8N_WEBHOOK_URL=.*|N8N_WEBHOOK_URL=https://n8n.example.com/|' .env.ci
          sed -i 's|^N8N_SECURE_COOKIE=.*|N8N_SECURE_COOKIE=true|' .env.ci
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env.ci
          sed -i "s|^AI_BRAIN_AUTH_SECRET=.*|AI_BRAIN_AUTH_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env.ci
          sed -i "s|^AI_BRAIN_WEBHOOK_TOKEN=.*|AI_BRAIN_WEBHOOK_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env.ci
          python infra/generate_keys.py --write .env.ci
          python ops/vps/validate_env.py .env.ci
          IMAGE_TAG=${TARGET_SHA} docker compose --env-file .env.ci --profile edge config > compose.rendered.yml
          grep -F 'API_DOMAIN_SECONDARY: api-alt.example.com' compose.rendered.yml
          if grep -Eqi 'change-me|local-dev|http://localhost' compose.rendered.yml; then
            echo 'Development value found in rendered production Compose' >&2
            exit 1
          fi
          for key in EVOLUTION_AUTHENTICATION_API_KEY EVOLUTION_DB_PASSWORD EVOLUTION_REDIS_PASSWORD EVOLUTION_WEBHOOK_HMAC_SECRET AI_BRAIN_SECRETS_KEY; do
            value="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            sed -i "s|^${key}=.*|${key}=${value}|" .env.ci
          done
          sed -i 's|^EVOLUTION_ENABLED=.*|EVOLUTION_ENABLED=true|' .env.ci
          sed -i 's|^AI_BRAIN_PUBLIC_API_URL=.*|AI_BRAIN_PUBLIC_API_URL=https://api.example.com|' .env.ci
          python ops/vps/validate_env.py .env.ci
          IMAGE_TAG=${TARGET_SHA} docker compose --env-file .env.ci --profile edge --profile evolution config --quiet

  publish:
    if: inputs.action != 'rollback' && inputs.action != 'inspect_lifecycle' && inputs.action != 'inspect_graph_bundle' && inputs.action != 'preflight_pause' && inputs.action != 'postflight_validate'
    needs: [classify, validate]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      repository: ${{ steps.meta.outputs.repository }}
      api_digest: ${{ steps.build_api.outputs.digest }}
      worker_digest: ${{ steps.build_worker.outputs.digest }}
      migrate_digest: ${{ steps.build_migrate.outputs.digest }}
      runtime_base_digest: ${{ steps.build_runtime_base.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - id: meta
        shell: bash
        run: |
          echo "image_tag=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Publish shared runtime base
        if: needs.classify.outputs.publish_api == 'true' || needs.classify.outputs.publish_worker == 'true'
        id: build_runtime_base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./api/Dockerfile
          target: runtime-base
          build-args: |
            SOURCE_SHA=${{ env.TARGET_SHA }}
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repository }}/brain-runtime-base:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=runtime-base
          cache-to: type=gha,mode=max,scope=runtime-base

      - name: Publish API image
        if: needs.classify.outputs.publish_api == 'true'
        id: build_api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./api/Dockerfile
          target: api
          build-args: |
            SOURCE_SHA=${{ env.TARGET_SHA }}
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repository }}/brain-api:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Publish worker image
        if: needs.classify.outputs.publish_worker == 'true'
        id: build_worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./api/Dockerfile
          target: workers
          build-args: |
            SOURCE_SHA=${{ env.TARGET_SHA }}
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repository }}/brain-workers:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=workers
          cache-to: type=gha,mode=max,scope=workers

      - name: Publish migration runner image
        if: needs.classify.outputs.publish_migrate == 'true'
        id: build_migrate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./infra/migrate.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repository }}/brain-migrate:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  production_gate:
    needs: classify
    if: inputs.action == 'inspect_lifecycle' || inputs.action == 'inspect_graph_bundle' || inputs.action == 'preflight_pause' || inputs.action == 'postflight_validate'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Audit and control the production release gate
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          GATE_ACTION: ${{ inputs.action }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          envs: VPS_APP_DIR,GATE_ACTION,CANDIDATE_SHA
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            current="$(tr -d '\r\n' < .deploy/current-tag)"
            [[ "$current" =~ ^[0-9a-f]{40}$ ]]
            bash ops/vps/audit.sh

            if [ "$GATE_ACTION" = "inspect_lifecycle" ]; then
              python3 ops/vps/release_lifecycle.py show
            elif [ "$GATE_ACTION" = "inspect_graph_bundle" ]; then
              test -f .deploy/control/claims-paused.json
              EXPECTED_RELEASE_SHA="$CANDIDATE_SHA" REQUIRE_FRESH_BACKUP=false \
                bash ops/vps/validate-production-release.sh
              docker compose --env-file .env.compose exec -T api python -c 'import json; from services import graph_bundle_view as g; c=g.list_versions("zypi-shop"); d=next(x for x in c["versions"] if x["ref"] == "bundle:sdr-whatsapp-multiproduto-draft.json"); assert d["source"] == "draft"; assert d["state"] == "blocked"; assert d["validation_error_count"] > 0; print(json.dumps({"persona_slug": c["persona"]["slug"], "ref": d["ref"], "state": d["state"], "validation_error_count": d["validation_error_count"], "read_only": c["read_only"]}, sort_keys=True))'
            elif [ "$GATE_ACTION" = "preflight_pause" ]; then
              lifecycle_stage="$(python3 ops/vps/release_lifecycle.py show --field stage)"
              lifecycle_candidate="$(python3 ops/vps/release_lifecycle.py show --field candidate_sha)"
              if [ "$lifecycle_stage" = "verified" ]; then
                python3 ops/vps/release_lifecycle.py prepare \
                  --candidate-sha "$CANDIDATE_SHA" \
                  --previous-sha "$current" \
                --impact-class api \
                --pause-reason "GraphBundle v3 controlled production release"
                bash ops/vps/pause-worker-claims.sh "GraphBundle v3 controlled production release"
                bash ops/vps/drain-worker-claims.sh
              elif [ "$lifecycle_stage" = "awaiting_resume_authorization" ] && [ "$lifecycle_candidate" = "$current" ]; then
                test -f .deploy/control/claims-paused.json
                echo "preserving_existing_pause_for=${lifecycle_candidate}"
              else
                echo "unsupported unfinished lifecycle: stage=${lifecycle_stage} candidate=${lifecycle_candidate}" >&2
                exit 1
              fi
              for minute in $(seq 1 15); do
                echo "quiet_window_minute=${minute}/15"
                sleep 60
              done
              EXPECTED_RELEASE_SHA="$current" REQUIRE_FRESH_BACKUP=false \
                bash ops/vps/validate-production-release.sh
            else
              test -f .deploy/control/claims-paused.json
              EXPECTED_RELEASE_SHA="$CANDIDATE_SHA" REQUIRE_FRESH_BACKUP=false \
                bash ops/vps/validate-production-release.sh
            fi
            if [ "$GATE_ACTION" != "inspect_lifecycle" ]; then
              python3 ops/vps/release_lifecycle.py show
            fi

  deploy:
    needs: [classify, validate, publish]
    if: >-
      always() &&
      (inputs.action == 'rollback' || needs.classify.outputs.touch_vps == 'true') &&
      needs.validate.result == 'success' &&
      (needs.publish.result == 'success' || inputs.action == 'rollback')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Rollback with an explicit image_tag checks out that commit's own
      # docker-compose.yml/Caddyfile/kong.yml/ops instead of main's latest,
      # so an older image is never paired with newer, possibly incompatible
      # config. Without an explicit tag, the previous tag is only resolved
      # on the VPS itself (ops/vps/rollback.sh reads .deploy/previous-tag)
      # — this workflow has no way to know it ahead of the checkout step,
      # so that case still deploys with main's current manifests.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ (inputs.action == 'rollback' && inputs.image_tag) || env.TARGET_SHA }}

      - name: Build checksummed release artifact
        if: inputs.action != 'rollback'
        shell: bash
        env:
          API_IMAGE_DIGEST: ${{ needs.publish.outputs.api_digest }}
          WORKER_IMAGE_DIGEST: ${{ needs.publish.outputs.worker_digest }}
          MIGRATE_IMAGE_DIGEST: ${{ needs.publish.outputs.migrate_digest }}
          RUNTIME_BASE_IMAGE_DIGEST: ${{ needs.publish.outputs.runtime_base_digest }}
        run: bash ops/release/build-artifact.sh "$TARGET_SHA"

      # The GitHub-hosted runner's outbound connection to the VPS
      # intermittently hits a bare TCP dial timeout (confirmed via VPS-side
      # sshd logs showing zero incoming attempts at the failure timestamps,
      # and no local/provider firewall involved) — transient network jitter
      # between the runner's datacenter and the VPS, not a config issue on
      # either end. Retrying is safe here specifically because the failure
      # is at the TCP handshake, before any remote command runs, so a retry
      # never risks re-running a partially-completed step.
      - name: Synchronize release artifact
        if: inputs.action != 'rollback'
        id: scp_attempt_1
        continue-on-error: true
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/vps/install-release-artifact.sh,.release/brain-release-${{ env.TARGET_SHA }}.tar.gz,.release/brain-release-${{ env.TARGET_SHA }}.tar.gz.sha256
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true

      - name: Wait before retrying artifact sync
        if: inputs.action != 'rollback' && steps.scp_attempt_1.outcome == 'failure'
        run: sleep 20

      - name: Synchronize release artifact (retry)
        if: inputs.action != 'rollback' && steps.scp_attempt_1.outcome == 'failure'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/vps/install-release-artifact.sh,.release/brain-release-${{ env.TARGET_SHA }}.tar.gz,.release/brain-release-${{ env.TARGET_SHA }}.tar.gz.sha256
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true

      # Unlike the manifest-sync step above, this step has not been observed
      # failing on its own — every deploy failure to date happened at the
      # scp step and never reached here (it shows as skipped in the run
      # history). It runs multi-stage side effects (backup, deploy,
      # publish/migration scripts), so it intentionally does NOT get a blind
      # connection retry: a mid-script failure retried blindly could re-run
      # those stages under a masked root cause. Revisit only if this step
      # itself starts showing the same bare "dial tcp ...: i/o timeout" at
      # its very first connection attempt.
      - name: Deploy immutable images over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
          IMPACT_CLASS: ${{ needs.classify.outputs.class }}
          REQUESTED_TAG: ${{ inputs.action == 'rollback' && inputs.image_tag || needs.publish.outputs.image_tag }}
          SUPERSEDE_RELEASE_AUTHORIZED: ${{ inputs.supersede_unfinished_release }}
          SUPERSEDE_RELEASE_REASON: ${{ inputs.supersede_reason }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # The verified full backup currently takes about eight minutes by
          # itself. appleboy defaults to a ten-minute remote command timeout,
          # which can terminate a healthy rollout after migrations but before
          # the worker and post-deploy audits are restored.
          command_timeout: 30m
          envs: GHCR_USERNAME,GHCR_TOKEN,VPS_APP_DIR,DEPLOY_ACTION,IMPACT_CLASS,REQUESTED_TAG,SUPERSEDE_RELEASE_AUTHORIZED,SUPERSEDE_RELEASE_REASON
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            bash ops/vps/audit.sh
            if [ "$DEPLOY_ACTION" = "rollback" ]; then
              bash ops/vps/rollback.sh "$REQUESTED_TAG"
            else
              bash ops/vps/install-release-artifact.sh \
                ".release/brain-release-${REQUESTED_TAG}.tar.gz" "$REQUESTED_TAG"
              bash ops/vps/deploy-incremental.sh "$IMPACT_CLASS" "$REQUESTED_TAG" --dry-run
              bash ops/vps/deploy-incremental.sh "$IMPACT_CLASS" "$REQUESTED_TAG" --apply
              bash ops/vps/release-checkpoint.sh "${REQUESTED_TAG:0:12}"
              # Content-contract validation is a separate concern from "did
              # the deploy succeed" — captured here instead of letting it
              # abort the script, so audit.sh (the real health check)
              # always runs next regardless, and a content-authoring gap
              # can never silently skip it again.
            fi
            bash ops/vps/audit.sh
