name: Deploy production VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy the selected image or roll back to the recorded previous image
        type: choice
        options: [deploy, rollback]
        default: deploy
      image_tag:
        description: Existing immutable SHA tag (optional; current commit for deploy, recorded previous for rollback)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r api/requirements-dev.txt

      - name: Compile backend
        run: python scripts/check_python_syntax.py

      - name: Block persona and commercial literals in runtime
        run: python scripts/check_persona_hardcodes.py

      - name: Validate migrations in disposable Postgres
        run: >-
          python -m pytest -q
          tests/test_graph_agent_v3_sql.py
          tests/test_whatsapp_sql_functions.py

      - name: Validate canonical n8n template and safe WA validator
        run: |
          python -m json.tool api/n8n-workflows/persona-conversation-template.json >/dev/null
          python -m pytest -q \
            tests/test_conversation_architecture_contract.py \
            tests/test_whatsapp_exactly_once.py \
            tests/test_conversation_modes.py \
            tests/test_wa_validator_service.py \
            api/tests/test_deepseek_n8n_service.py

      - name: Run backend tests
        env:
          ASSET_OCR_BACKEND: mock
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_KEY: ci-local-placeholder
          SUPABASE_RETRY_ATTEMPTS: "0"
          SUPABASE_HTTP_TIMEOUT_SECONDS: "2"
          SUPABASE_OFFLINE: "true"
          KNOWLEDGE_TAXONOMY_OFFLINE: "true"
        run: >-
          python -m pytest -q
          tests/test_production_env.py
          tests/test_public_route_allowlist.py
          tests/test_graph_json_validator.py
          tests/test_approved_faq_publication_contract.py
          tests/test_aurora_appointment_runtime.py
          tests/test_seed_aurora_credentials.py
          tests/test_conversation_runtime.py
          tests/test_conversation_modes.py
          tests/test_deterministic_sdr.py
          tests/test_whatsapp_exactly_once.py
          tests/test_whatsapp_migration_contract.py
          tests/test_whatsapp_runtime.py
          tests/test_agents_service_resume.py
          tests/test_whatsapp_resume_migration.py
          api/tests/test_graph_markdown_catalog.py
          api/tests/test_lead_qualification.py
          api/tests/test_client_portal.py

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard for Vercel proxy contract
        working-directory: dashboard
        env:
          API_INTERNAL_BASE_URL: https://api.example.com
          NEXT_PUBLIC_API_BASE_URL: /api-brain
        run: npm ci && npm run build && npm test

      - name: Validate production Compose
        shell: bash
        run: |
          cp .env.compose.example .env.ci
          sed -i 's|^ENVIRONMENT=.*|ENVIRONMENT=production|' .env.ci
          sed -i 's|^API_DOMAIN=.*|API_DOMAIN=api.example.com|' .env.ci
          sed -i 's|^STORAGE_DOMAIN=.*|STORAGE_DOMAIN=storage.example.com|' .env.ci
          sed -i 's|^N8N_DOMAIN=.*|N8N_DOMAIN=n8n.example.com|' .env.ci
          sed -i 's|^ACME_EMAIL=.*|ACME_EMAIL=ops@example.com|' .env.ci
          sed -i 's|^SUPABASE_PUBLIC_URL=.*|SUPABASE_PUBLIC_URL=https://storage.example.com|' .env.ci
          sed -i 's|^ALLOWED_ORIGINS=.*|ALLOWED_ORIGINS=https://dashboard.example.com|' .env.ci
          sed -i 's|^AI_BRAIN_COOKIE_SECURE=.*|AI_BRAIN_COOKIE_SECURE=true|' .env.ci
          sed -i 's|^N8N_PROTOCOL=.*|N8N_PROTOCOL=https|' .env.ci
          sed -i 's|^N8N_EDITOR_BASE_URL=.*|N8N_EDITOR_BASE_URL=https://n8n.example.com|' .env.ci
          sed -i 's|^N8N_WEBHOOK_URL=.*|N8N_WEBHOOK_URL=https://n8n.example.com/|' .env.ci
          sed -i 's|^N8N_SECURE_COOKIE=.*|N8N_SECURE_COOKIE=true|' .env.ci
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env.ci
          sed -i "s|^AI_BRAIN_AUTH_SECRET=.*|AI_BRAIN_AUTH_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env.ci
          sed -i "s|^AI_BRAIN_WEBHOOK_TOKEN=.*|AI_BRAIN_WEBHOOK_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env.ci
          python infra/generate_keys.py --write .env.ci
          python ops/vps/validate_env.py .env.ci
          IMAGE_TAG=${GITHUB_SHA} docker compose --env-file .env.ci config > compose.rendered.yml
          if grep -Eqi 'change-me|local-dev|http://localhost' compose.rendered.yml; then
            echo 'Development value found in rendered production Compose' >&2
            exit 1
          fi
          for key in EVOLUTION_AUTHENTICATION_API_KEY EVOLUTION_DB_PASSWORD EVOLUTION_REDIS_PASSWORD EVOLUTION_WEBHOOK_HMAC_SECRET AI_BRAIN_SECRETS_KEY; do
            value="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            sed -i "s|^${key}=.*|${key}=${value}|" .env.ci
          done
          sed -i 's|^EVOLUTION_ENABLED=.*|EVOLUTION_ENABLED=true|' .env.ci
          sed -i 's|^AI_BRAIN_PUBLIC_API_URL=.*|AI_BRAIN_PUBLIC_API_URL=https://api.example.com|' .env.ci
          python ops/vps/validate_env.py .env.ci
          IMAGE_TAG=${GITHUB_SHA} docker compose --env-file .env.ci --profile evolution config --quiet

  publish:
    if: github.event_name == 'push' || inputs.action != 'rollback'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      repository: ${{ steps.meta.outputs.repository }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish API and worker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repository }}/brain-api:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Publish migration runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/migrate.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repository }}/brain-migrate:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy:
    needs: [validate, publish]
    if: always() && needs.validate.result == 'success' && (needs.publish.result == 'success' || inputs.action == 'rollback')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Rollback with an explicit image_tag checks out that commit's own
      # docker-compose.yml/Caddyfile/kong.yml/ops instead of main's latest,
      # so an older image is never paired with newer, possibly incompatible
      # config. Without an explicit tag, the previous tag is only resolved
      # on the VPS itself (ops/vps/rollback.sh reads .deploy/previous-tag)
      # — this workflow has no way to know it ahead of the checkout step,
      # so that case still deploys with main's current manifests.
      - uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.action == 'rollback' && inputs.image_tag) || github.sha }}

      # The GitHub-hosted runner's outbound connection to the VPS
      # intermittently hits a bare TCP dial timeout (confirmed via VPS-side
      # sshd logs showing zero incoming attempts at the failure timestamps,
      # and no local/provider firewall involved) — transient network jitter
      # between the runner's datacenter and the VPS, not a config issue on
      # either end. Retrying is safe here specifically because the failure
      # is at the TCP handshake, before any remote command runs, so a retry
      # never risks re-running a partially-completed step.
      - name: Synchronize deployment manifests
        id: scp_attempt_1
        continue-on-error: true
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml,infra/Caddyfile,infra/kong.yml,infra/grafana,ops/vps
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true

      - name: Wait before retrying manifest sync
        if: steps.scp_attempt_1.outcome == 'failure'
        run: sleep 20

      - name: Synchronize deployment manifests (retry)
        if: steps.scp_attempt_1.outcome == 'failure'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml,infra/Caddyfile,infra/kong.yml,infra/grafana,ops/vps
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true

      # Unlike the manifest-sync step above, this step has not been observed
      # failing on its own — every deploy failure to date happened at the
      # scp step and never reached here (it shows as skipped in the run
      # history). It runs multi-stage side effects (backup, deploy,
      # publish/migration scripts), so it intentionally does NOT get a blind
      # connection retry: a mid-script failure retried blindly could re-run
      # those stages under a masked root cause. Revisit only if this step
      # itself starts showing the same bare "dial tcp ...: i/o timeout" at
      # its very first connection attempt.
      - name: Deploy immutable images over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
          REQUESTED_TAG: ${{ inputs.image_tag || needs.publish.outputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # The verified full backup currently takes about eight minutes by
          # itself. appleboy defaults to a ten-minute remote command timeout,
          # which can terminate a healthy rollout after migrations but before
          # the worker and post-deploy audits are restored.
          command_timeout: 30m
          envs: GHCR_USERNAME,GHCR_TOKEN,VPS_APP_DIR,DEPLOY_ACTION,REQUESTED_TAG
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            content_status=0
            if [ "$DEPLOY_ACTION" = "rollback" ]; then
              bash ops/vps/rollback.sh "$REQUESTED_TAG"
            else
              bash ops/vps/backup-release.sh "pre-knowledge-crm-${REQUESTED_TAG:0:12}"
              bash ops/vps/deploy.sh "$REQUESTED_TAG"
              docker compose --env-file .env.compose exec -T api \
                python scripts/publish_aurora_graph.py
              docker compose --env-file .env.compose exec -T api \
                python scripts/publish_persona_documents.py vz-lupas
              docker compose --env-file .env.compose exec -T api \
                python scripts/backfill_lead_qualification.py --apply
              docker compose --env-file .env.compose exec -T api \
                python scripts/resync_graph_agent_workflows.py \
                  aurora vz-lupas --active-persona aurora
              # Content-contract validation is a separate concern from "did
              # the deploy succeed" — captured here instead of letting it
              # abort the script, so audit.sh (the real health check)
              # always runs next regardless, and a content-authoring gap
              # can never silently skip it again.
              docker compose --env-file .env.compose exec -T api \
                python scripts/validate_knowledge_crm_release.py || content_status=$?
            fi
            bash ops/vps/audit.sh
            if [ "$content_status" -ne 0 ]; then
              echo "::warning::Content release-contract validation failed (exit ${content_status}); deploy and audit above are healthy independent of this." >&2
              exit "$content_status"
            fi
