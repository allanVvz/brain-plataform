name: Diagnose production conversation executions

on:
  workflow_dispatch:
    inputs:
      persona_slug:
        description: Persona whose canonical n8n executions are inspected
        type: choice
        options: [tock-fatal, aurora, vz-lupas]
        required: true
      limit:
        description: Number of recent executions (maximum 20)
        required: true
        default: "10"
      candidate_workflow_id:
        description: Optional isolated validation workflow ID; never changes the active binding
        required: false
      candidate_id:
        description: Optional validation candidate namespace; resolves the newest matching workflow
        required: false

permissions:
  contents: read

concurrency:
  group: brain-ai-production-read-only
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect sanitized n8n execution timings
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          PERSONA_SLUG: ${{ inputs.persona_slug }}
          EXECUTION_LIMIT: ${{ inputs.limit }}
          CANDIDATE_WORKFLOW_ID: ${{ inputs.candidate_workflow_id }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          envs: VPS_APP_DIR,PERSONA_SLUG,EXECUTION_LIMIT,CANDIDATE_WORKFLOW_ID,CANDIDATE_ID
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            [[ "$PERSONA_SLUG" =~ ^(tock-fatal|aurora|vz-lupas)$ ]]
            [[ "$EXECUTION_LIMIT" =~ ^[0-9]+$ ]]
            (( EXECUTION_LIMIT >= 1 && EXECUTION_LIMIT <= 20 ))
            [[ -z "$CANDIDATE_WORKFLOW_ID" || "$CANDIDATE_WORKFLOW_ID" =~ ^[A-Za-z0-9_-]{8,64}$ ]]
            [[ -z "$CANDIDATE_ID" || "$CANDIDATE_ID" =~ ^[a-z0-9-]{8,80}$ ]]
            [[ -z "$CANDIDATE_WORKFLOW_ID" || -z "$CANDIDATE_ID" ]]
            state_file=.deploy/microservices/slots.json
            slot="$(python3 -c 'import json; print(json.load(open(".deploy/microservices/slots.json", encoding="utf-8"))["control-plane"]["active"])')"
            container="brain-ai-control-plane-${slot}-1"
            docker exec -i \
              -e PERSONA_SLUG="$PERSONA_SLUG" \
              -e EXECUTION_LIMIT="$EXECUTION_LIMIT" \
              -e CANDIDATE_WORKFLOW_ID="$CANDIDATE_WORKFLOW_ID" \
              -e CANDIDATE_ID="$CANDIDATE_ID" \
              "$container" python - <<'PY'
            import json
            import os
            from services import n8n_client, supabase_client

            slug = os.environ["PERSONA_SLUG"]
            limit = int(os.environ["EXECUTION_LIMIT"])
            persona = supabase_client.get_persona(slug)
            bindings = supabase_client.get_workflow_bindings(str(persona["id"]))
            binding = next(row for row in bindings if row.get("active"))
            active_workflow_id = str(binding.get("n8n_workflow_id") or "")
            candidate_workflow_id = os.environ.get("CANDIDATE_WORKFLOW_ID", "").strip()
            candidate_id = os.environ.get("CANDIDATE_ID", "").strip()
            if candidate_id:
                suffix = f"validation {candidate_id}"
                matches = [
                    row for row in n8n_client.get_workflows()
                    if str(row.get("name") or "").endswith(suffix)
                ]
                assert matches, "validation candidate workflow not found"
                matches.sort(
                    key=lambda row: str(row.get("updatedAt") or row.get("createdAt") or ""),
                    reverse=True,
                )
                candidate_workflow_id = str(matches[0].get("id") or "")
            workflow_id = candidate_workflow_id or active_workflow_id
            assert workflow_id, "active binding has no n8n workflow"

            target_kind = "candidate" if candidate_workflow_id else "active"
            workflow = n8n_client.get_workflow(workflow_id) or {}
            assert workflow, "n8n workflow not found"
            if candidate_workflow_id:
                inbound = next(
                    (node for node in workflow.get("nodes") or [] if node.get("id") == "inbound"),
                    {},
                )
                webhook_path = str((inbound.get("parameters") or {}).get("path") or "").strip("/")
                assert webhook_path.startswith(f"{slug}/validation/"), "candidate persona or namespace mismatch"
                assert workflow_id != active_workflow_id, "candidate workflow must not be the active binding"
            executions = n8n_client.get_executions(
                limit=limit,
                workflow_id=workflow_id,
                include_data=True,
            )
            sanitized = []
            for execution in executions:
                result = ((execution.get("data") or {}).get("resultData") or {})
                run_data = result.get("runData") or {}
                nodes = []
                for name, attempts in run_data.items():
                    for attempt in attempts or []:
                        error = attempt.get("error") or {}
                        contract_shape = None
                        if name == "Bound understanding model":
                            output_items = [
                                item
                                for branch in (((attempt.get("data") or {}).get("main") or []))
                                for item in (branch or [])
                            ]
                            content = str(
                                (((((output_items[0].get("json") or {}).get("choices") or [{}])[0]).get("message") or {}).get("content") or "")
                                if output_items else ""
                            )
                            try:
                                parsed_contract = json.loads(content)
                            except (TypeError, ValueError):
                                parsed_contract = None
                            if isinstance(parsed_contract, dict):
                                questions = parsed_contract.get("customer_questions")
                                facts = parsed_contract.get("facts")
                                branches = parsed_contract.get("branch_selections")
                                confirmation = parsed_contract.get("confirmation")
                                observation = parsed_contract.get("interaction_observation")
                                contract_shape = {
                                    "keys": sorted(str(key) for key in parsed_contract),
                                    "facts_type": type(facts).__name__,
                                    "facts": [
                                        {"keys": sorted(str(key) for key in fact)}
                                        for fact in facts if isinstance(fact, dict)
                                    ] if isinstance(facts, list) else [],
                                    "branch_selections_type": type(branches).__name__,
                                    "branch_selections": [
                                        {
                                            "keys": sorted(str(key) for key in branch),
                                            "action": branch.get("action"),
                                            "anchor_type": type(branch.get("branch_anchor_node_id")).__name__,
                                        }
                                        for branch in branches if isinstance(branch, dict)
                                    ] if isinstance(branches, list) else [],
                                    "confirmation_type": type(confirmation).__name__,
                                    "confirmation_state": confirmation.get("state") if isinstance(confirmation, dict) else None,
                                    "confirmation_keys": sorted(str(key) for key in confirmation) if isinstance(confirmation, dict) else [],
                                    "customer_questions_type": type(questions).__name__,
                                    "customer_questions": [
                                        {
                                            "keys": sorted(str(key) for key in question),
                                            "kind_type": type(question.get("kind")).__name__,
                                            "entity_node_ids_type": type(question.get("entity_node_ids")).__name__,
                                            "entity_node_id_types": [
                                                type(value).__name__
                                                for value in (question.get("entity_node_ids") or [])
                                            ] if isinstance(question.get("entity_node_ids"), list) else [],
                                        }
                                        for question in questions
                                        if isinstance(question, dict)
                                    ] if isinstance(questions, list) else [],
                                    "interaction_observation_type": type(observation).__name__,
                                    "interaction_observation_kind": observation.get("kind") if isinstance(observation, dict) else None,
                                    "interaction_observation_keys": sorted(str(key) for key in observation) if isinstance(observation, dict) else [],
                                    "interaction_observation_confidence_type": type(observation.get("confidence")).__name__ if isinstance(observation, dict) else None,
                                }
                        nodes.append({
                            "name": name,
                            "execution_time_ms": attempt.get("executionTime"),
                            "start_time_ms": attempt.get("startTime"),
                            "error_name": error.get("name"),
                            "error_message": str(error.get("message") or "")[:300] or None,
                            "http_code": error.get("httpCode"),
                            "contract_shape": contract_shape,
                            "forwarded_errors": [
                                {
                                    "message": str(((item.get("json") or {}).get("error") or {}).get("message") or "")[:300] or None,
                                    "description": str(((item.get("json") or {}).get("error") or {}).get("description") or "")[:300] or None,
                                    "http_code": ((item.get("json") or {}).get("error") or {}).get("httpCode"),
                                    "node": ((((item.get("json") or {}).get("error") or {}).get("node") or {}).get("name")),
                                }
                                for branch in (((attempt.get("data") or {}).get("main") or []))
                                for item in (branch or [])
                                if isinstance((item.get("json") or {}).get("error"), dict)
                            ],
                            "forwarded_failures": [
                                {
                                    "keys": sorted(str(key) for key in (item.get("json") or {}).keys()),
                                    "error_type": type((item.get("json") or {}).get("error")).__name__,
                                    "error_value": str((item.get("json") or {}).get("error") or "")[:500] or None,
                                    "message": str((item.get("json") or {}).get("message") or "")[:300] or None,
                                    "description": str((item.get("json") or {}).get("description") or "")[:300] or None,
                                    "status_code": (item.get("json") or {}).get("statusCode"),
                                    "code": (item.get("json") or {}).get("code"),
                                }
                                for branch in (((attempt.get("data") or {}).get("main") or [])[1:])
                                for item in (branch or [])
                            ],
                        })
                sanitized.append({
                    "id": execution.get("id"),
                    "status": execution.get("status"),
                    "started_at": execution.get("startedAt"),
                    "stopped_at": execution.get("stoppedAt"),
                    "last_node_executed": result.get("lastNodeExecuted"),
                    "top_error": str((result.get("error") or {}).get("message") or "")[:300] or None,
                    "nodes": nodes,
                })
            print("N8N_EXECUTION_DIAGNOSTIC=" + json.dumps({
                "persona_slug": slug,
                "workflow_id": workflow_id,
                "target_kind": target_kind,
                "executions": sanitized,
            }, ensure_ascii=True, sort_keys=True))
            PY
