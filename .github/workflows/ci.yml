name: Check Frontend e Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Instalar dependencias do backend
        working-directory: api
        run: python -m pip install -r requirements-dev.txt

      - name: Checar backend
        working-directory: api
        run: python -m compileall -q .

      - name: Bloquear fatos de persona em codigo e workflow
        run: python scripts/check_persona_hardcodes.py

      - name: Scan de segredos
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar migrations em Postgres descartavel
        run: >-
          python -m pytest -q
          tests/test_graph_agent_v3_sql.py
          tests/test_whatsapp_sql_functions.py
          tests/test_production_privileges_sql.py

      - name: Validar template canonico e invariantes conversacionais
        run: |
          python -m json.tool api/n8n-workflows/persona-conversation-template.json >/dev/null
          python -m pytest -q \
            tests/test_conversation_architecture_contract.py \
            tests/test_whatsapp_exactly_once.py \
            tests/test_conversation_modes.py \
            tests/test_wa_validator_service.py \
            api/tests/test_deepseek_n8n_service.py

      - name: Testar backend canônico com timeout
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_KEY: ci-local-placeholder
          SUPABASE_RETRY_ATTEMPTS: "0"
          SUPABASE_HTTP_TIMEOUT_SECONDS: "2"
          SUPABASE_OFFLINE: "true"
          KNOWLEDGE_TAXONOMY_OFFLINE: "true"
        run: |
          timeout --signal=TERM --kill-after=15s 240s python -m pytest tests \
            --ignore=tests/e2e \
            --ignore=tests/test_graph_agent_v3_sql.py \
            --ignore=tests/test_whatsapp_sql_functions.py \
            --ignore=tests/test_bra91_allanvvz_safe_crawler_snapshot.py \
            --ignore=tests/test_qa_contract_routes.py \
            --ignore=tests/test_sofia_primary_tree_publication.py \
            --ignore=tests/test_sofia_session_context.py \
            --ignore=tests/test_sofia_v2_patch_loop.py \
            -q

      - name: Testar contratos canônicos críticos
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_KEY: ci-local-placeholder
          SUPABASE_RETRY_ATTEMPTS: "0"
          SUPABASE_HTTP_TIMEOUT_SECONDS: "2"
          SUPABASE_OFFLINE: "true"
          KNOWLEDGE_TAXONOMY_OFFLINE: "true"
        run: |
          timeout --signal=TERM --kill-after=15s 300s python -m pytest \
            tests/test_graph_document_publisher.py \
            tests/test_graph_json_projection_markdown.py \
            tests/test_sofia_canonical_graph_patch.py \
            tests/test_approved_faq_publication_contract.py \
            tests/test_aurora_appointment_runtime.py \
            tests/test_seed_aurora_credentials.py \
            tests/test_conversation_runtime.py \
            tests/test_deterministic_sdr.py \
            api/tests/test_graph_markdown_catalog.py \
            api/tests/test_lead_qualification.py \
            api/tests/test_client_portal.py \
            api/tests/test_deepseek_n8n_service.py \
            api/tests/test_persona_routing.py \
            api/tests/test_n8n_failure_diagnostics.py \
            api/tests/test_n8n_mirror_diagnostics.py \
            -q

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Instalar dependencias do frontend
        working-directory: dashboard
        run: npm ci

      - name: Build frontend
        working-directory: dashboard
        env:
          API_INTERNAL_BASE_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_API_BASE_URL: /api-brain
        run: npm run build

      - name: Testar frontend
        working-directory: dashboard
        run: npm test && npm run test:wa-validator-safe

      - name: Validar Compose com perfil Evolution
        shell: bash
        run: |
          cp .env.compose.example .env.evolution-ci
          python infra/generate_keys.py --write .env.evolution-ci
          for key in EVOLUTION_AUTHENTICATION_API_KEY EVOLUTION_DB_PASSWORD EVOLUTION_REDIS_PASSWORD EVOLUTION_WEBHOOK_HMAC_SECRET AI_BRAIN_SECRETS_KEY; do
            value="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            sed -i "s|^${key}=.*|${key}=${value}|" .env.evolution-ci
          done
          sed -i 's|^EVOLUTION_ENABLED=.*|EVOLUTION_ENABLED=true|' .env.evolution-ci
          sed -i 's|^AI_BRAIN_PUBLIC_API_URL=.*|AI_BRAIN_PUBLIC_API_URL=https://api.example.com|' .env.evolution-ci
          docker compose --env-file .env.evolution-ci --profile evolution config --quiet

      - name: Auditar dependencias e gerar SBOM
        run: |
          python -m pip install pip-audit==2.9.0 cyclonedx-bom==7.1.0
          python -m pip_audit -r api/requirements.txt
          mkdir -p artifacts
          cyclonedx-py requirements api/requirements.txt --output-file artifacts/api-sbom.json

      - name: Build da imagem auditavel
        run: docker build -f api/Dockerfile -t brain-api:ci .

      - name: Scan da imagem
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: brain-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Publicar SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-sbom
          path: artifacts/api-sbom.json
