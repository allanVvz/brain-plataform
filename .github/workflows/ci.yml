name: Check Frontend e Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detectar escopos alterados
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          base="$BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$BASE_SHA"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          fi
          changed() { grep -Eq "$1" <<<"$files" && echo true || echo false; }
          force_all="$(changed '^\.github/workflows/ci\.yml$')"
          scoped() { if [ "$force_all" = "true" ]; then echo true; else changed "$1"; fi; }
          conversation_gate='^(tests/fixtures/(conversation_repetition_cases|sdr_flow_cases)\.json|apps/conversation-runtime/api/services/(conversation_repetition|graph_agent_runtime_v3|graph_proof_checker_v3|wa_validator_service)\.py|apps/conversation-runtime/n8n/persona-conversation-template\.json|apps/conversation-runtime/api/scripts/fixtures/[^/]*graph[^/]*\.json|dashboard/scripts/(conversation-repetition|wa-validator-driver|wa-validator)\.mjs|dashboard/e2e/wa-validator/)'
          echo "backend=$(scoped "^(api/|apps/|packages/|tests/|supabase/migrations/|scripts/check_.*\.py$|${conversation_gate#^})")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(scoped "^(dashboard/|${conversation_gate#^})")" >> "$GITHUB_OUTPUT"
          echo "compose=$(scoped '^(docker-compose\.yml|\.env\.compose\.example|infra/|ops/vps/|Caddyfile|kong\.yml)')" >> "$GITHUB_OUTPUT"
          echo "python_deps=$(scoped '^api/requirements(-[^/]+)?\.txt$')" >> "$GITHUB_OUTPUT"
          echo "image=$(scoped '^(api/Dockerfile|api/requirements(-[^/]+)?\.txt|infra/migrate\.Dockerfile)$')" >> "$GITHUB_OUTPUT"
          echo "workflows=$(changed '^\.github/workflows/')" >> "$GITHUB_OUTPUT"

      - name: Validar sintaxe dos workflows alterados
        if: steps.changes.outputs.workflows == 'true'
        run: ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].each { |f| YAML.load_file(f) }"

      - name: Configurar Python
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.python_deps == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Instalar dependências do backend
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.python_deps == 'true'
        run: python -m pip install -r api/requirements-dev.txt

      - name: Checar backend e anti-hardcode
        if: steps.changes.outputs.backend == 'true'
        run: |
          python scripts/check_python_syntax.py
          python scripts/check_monorepo_boundaries.py
          python scripts/check_persona_hardcodes.py
          python -m json.tool apps/conversation-runtime/n8n/persona-conversation-template.json >/dev/null

      - name: Testar backend uma única vez
        if: steps.changes.outputs.backend == 'true'
        env:
          ASSET_OCR_BACKEND: mock
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_KEY: ci-local-placeholder
          SUPABASE_RETRY_ATTEMPTS: "0"
          SUPABASE_HTTP_TIMEOUT_SECONDS: "2"
          SUPABASE_OFFLINE: "true"
          KNOWLEDGE_TAXONOMY_OFFLINE: "true"
        run: |
          timeout --signal=TERM --kill-after=15s 600s python -m pytest -q
          timeout --signal=TERM --kill-after=15s 600s python scripts/test_monorepo_apps.py

      - name: Configurar Node
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build e testes do frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: dashboard
        env:
          API_INTERNAL_BASE_URL: https://api.example.com
          NEXT_PUBLIC_API_BASE_URL: /api-brain
        run: npm ci && npm run build && npm test && npm run test:wa-validator-safe && npx playwright test e2e/wa-validator/sdr-flow-corpus.spec.ts --config=playwright.wa-validator.config.ts

      - name: Validar Compose alterado
        if: steps.changes.outputs.compose == 'true'
        shell: bash
        run: |
          cp .env.compose.example .env.evolution-ci
          python infra/generate_keys.py --write .env.evolution-ci
          sed -i 's|^ENVIRONMENT=.*|ENVIRONMENT=production|' .env.evolution-ci
          sed -i 's|^API_DOMAIN=.*|API_DOMAIN=api.example.com|' .env.evolution-ci
          sed -i 's|^API_DOMAIN_SECONDARY=.*|API_DOMAIN_SECONDARY=api-alt.example.com|' .env.evolution-ci
          sed -i 's|^STORAGE_DOMAIN=.*|STORAGE_DOMAIN=storage.example.com|' .env.evolution-ci
          sed -i 's|^N8N_DOMAIN=.*|N8N_DOMAIN=n8n.example.com|' .env.evolution-ci
          sed -i 's|^ACME_EMAIL=.*|ACME_EMAIL=ops@example.com|' .env.evolution-ci
          sed -i 's|^SUPABASE_PUBLIC_URL=.*|SUPABASE_PUBLIC_URL=https://storage.example.com|' .env.evolution-ci
          sed -i 's|^ALLOWED_ORIGINS=.*|ALLOWED_ORIGINS=https://dashboard.example.com|' .env.evolution-ci
          sed -i 's|^API_INTERNAL_BASE_URL=.*|API_INTERNAL_BASE_URL=https://api.example.com|' .env.evolution-ci
          sed -i 's|^AI_BRAIN_COOKIE_SECURE=.*|AI_BRAIN_COOKIE_SECURE=true|' .env.evolution-ci
          sed -i 's|^N8N_PROTOCOL=.*|N8N_PROTOCOL=https|' .env.evolution-ci
          sed -i 's|^N8N_EDITOR_BASE_URL=.*|N8N_EDITOR_BASE_URL=https://n8n.example.com|' .env.evolution-ci
          sed -i 's|^N8N_WEBHOOK_URL=.*|N8N_WEBHOOK_URL=https://n8n.example.com/|' .env.evolution-ci
          sed -i 's|^N8N_SECURE_COOKIE=.*|N8N_SECURE_COOKIE=true|' .env.evolution-ci
          sed -i 's|^EVOLUTION_ENABLED=.*|EVOLUTION_ENABLED=true|' .env.evolution-ci
          sed -i 's|^AI_BRAIN_PUBLIC_API_URL=.*|AI_BRAIN_PUBLIC_API_URL=https://api.example.com|' .env.evolution-ci
          for key in POSTGRES_PASSWORD AI_BRAIN_AUTH_SECRET AI_BRAIN_WEBHOOK_TOKEN EVOLUTION_AUTHENTICATION_API_KEY EVOLUTION_DB_PASSWORD EVOLUTION_REDIS_PASSWORD EVOLUTION_WEBHOOK_HMAC_SECRET AI_BRAIN_SECRETS_KEY; do
            value="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            sed -i "s|^${key}=.*|${key}=${value}|" .env.evolution-ci
          done
          python ops/vps/validate_env.py .env.evolution-ci
          docker compose --env-file .env.evolution-ci --profile edge --profile evolution config --quiet

      - name: Auditar dependências Python alteradas
        if: steps.changes.outputs.python_deps == 'true'
        run: |
          python -m pip install pip-audit==2.9.0 cyclonedx-bom==7.1.0
          python -m pip_audit -r api/requirements.txt
          mkdir -p artifacts
          cyclonedx-py requirements api/requirements.txt --output-file artifacts/api-sbom.json

      - name: Publicar SBOM
        if: steps.changes.outputs.python_deps == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-sbom
          path: artifacts/api-sbom.json

      - name: Scan de segredos
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build da imagem alterada
        if: steps.changes.outputs.image == 'true'
        run: docker build --target api -f api/Dockerfile -t brain-api:ci .

      - name: Scan da imagem alterada
        if: steps.changes.outputs.image == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: brain-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
