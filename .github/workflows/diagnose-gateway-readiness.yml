name: Diagnose gateway readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-ai-production-read-only
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect isolated gateway and internal upstreams
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AUDIT_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          envs: AUDIT_ROOT
          script_path: ops/vps/diagnose-gateway-readiness.sh
