name: Audit production deploy messages

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: Inclusive UTC deploy-window start
        required: true
      window_end:
        description: Exclusive UTC deploy-window end
        required: true
      persona_slug:
        description: Persona scope
        type: choice
        options: [tock-fatal, utzig-garage, all]
        default: all
      lead_ref:
        description: Optional exact lead id for masked dialogue and proof audit; requires one persona
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: brain-ai-production-read-only
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit canonical inbound continuity without message content
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
          PERSONA_SLUG: ${{ inputs.persona_slug }}
          LEAD_REF: ${{ inputs.lead_ref }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,WINDOW_START,WINDOW_END,PERSONA_SLUG,LEAD_REF
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            [[ "$PERSONA_SLUG" == all || "$PERSONA_SLUG" == tock-fatal || "$PERSONA_SLUG" == utzig-garage ]]
            if [[ -n "$LEAD_REF" ]]; then
              [[ "$LEAD_REF" =~ ^[0-9]{1,12}$ && "$PERSONA_SLUG" != all ]]
            fi
            [[ "$WINDOW_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
            [[ "$WINDOW_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
            python3 -c 'import json,pathlib; f=pathlib.Path(".deploy/control/claims-paused.json"); p=json.load(f.open(encoding="utf-8")) if f.exists() else {"paused":False,"reason":"pause file absent"}; print("CLAIMS_PAUSE_STATE="+json.dumps({k:p.get(k) for k in ("paused","reason","updated_at","created_at")},sort_keys=True))'
            compose=(docker compose --env-file .env.compose -f docker-compose.yml -f infra/microservices/docker-compose.blue-green.yml)
            "${compose[@]}" exec -T -e PGOPTIONS='-c default_transaction_read_only=on' db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|"' <<'SQL'
            select 'AGENT_PERSONA_STATE', slug, id, active
            from public.personas
            where slug in ('tock-fatal', 'utzig-garage')
            order by slug;

            select 'AGENT_BINDING_STATE', p.slug, b.id, b.active,
              coalesce(b.connection_status, ''),
              coalesce((b.metadata->>'safety_paused')::boolean, false),
              coalesce(b.metadata->>'decision_owner', ''),
              (select count(*) from public.lead_buffer lb
               where lb.channel_binding_id = b.id and lb.direction = 'inbound'
                 and lb.status in ('received', 'buffered', 'retry', 'processing', 'awaiting_proof')),
              (select count(*) from public.lead_buffer lb
               where lb.channel_binding_id = b.id and lb.direction = 'inbound'
                 and lb.status = 'waiting_human')
            from public.workflow_bindings b
            join public.personas p on p.id = b.persona_id
            where p.slug in ('tock-fatal', 'utzig-garage') and b.channel = 'whatsapp'
            order by p.slug, b.active desc, b.created_at desc;
            SQL
            "${compose[@]}" exec -T \
              -e PGOPTIONS='-c default_transaction_read_only=on' \
              -e WINDOW_START="$WINDOW_START" -e WINDOW_END="$WINDOW_END" -e PERSONA_SLUG="$PERSONA_SLUG" \
              db sh -c 'psql -v ON_ERROR_STOP=1 -v WINDOW_START="$WINDOW_START" -v WINDOW_END="$WINDOW_END" -v PERSONA_SLUG="$PERSONA_SLUG" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|"' <<'SQL'
            select 'PERSONA_LEAD', p.slug, l.id, left(l.nome,80), l.ai_paused, l.handoff_level
            from public.leads l join public.personas p on p.id=l.persona_id
            where :'PERSONA_SLUG' <> 'all' and p.slug=:'PERSONA_SLUG'
              and (lower(l.nome) like '%alisson%' or exists (
                select 1 from public.lead_buffer b where b.lead_ref=l.id
                and b.persona_id=p.id and b.direction='inbound'
                and b.external_message_id like 'wamid.%'))
            order by l.id limit 20;

            with scope as (
              select id from public.personas
              where :'PERSONA_SLUG' = 'all' or slug = :'PERSONA_SLUG'
            ), window_buffers as (
              select b.* from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.created_at >= :'WINDOW_START'::timestamptz
                and b.created_at < :'WINDOW_END'::timestamptz
            ), real_buffers as (
              select * from window_buffers
              where coalesce(external_message_id,'') not like 'validator:%'
                and coalesce(payload->>'source','') <> 'wa_validator'
            )
            select 'DEPLOY_WINDOW_BUFFER_STATUS',direction,status,count(*)
            from real_buffers group by direction,status order by direction,status;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG'),
            inbound as (
              select b.* from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.direction='inbound' and b.created_at>=:'WINDOW_START'::timestamptz and b.created_at<:'WINDOW_END'::timestamptz
                and coalesce(b.external_message_id,'') not like 'validator:%'
                and coalesce(b.payload->>'source','') <> 'wa_validator'
            )
            select 'DEPLOY_WINDOW_INBOUND',count(*),count(distinct lead_ref),
              count(*) filter(where status in ('received','buffered','retry')),
              count(*) filter(where status in ('processing','awaiting_proof')),
              count(*) filter(where status='dead_letter'),
              count(*) filter(where payload->'conversation_commit' is not null)
            from inbound;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG'),
            inbound as (
              select b.* from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.direction='inbound' and b.created_at>=:'WINDOW_START'::timestamptz and b.created_at<:'WINDOW_END'::timestamptz
                and coalesce(b.external_message_id,'') not like 'validator:%'
            )
            select 'INBOUND_WITHOUT_MESSAGE_PROJECTION',count(*)
            from inbound b where b.external_message_id is not null and not exists (
              select 1 from public.messages m where m.external_message_id=b.external_message_id
            );

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'MESSAGE_WITHOUT_BUFFER_ENVELOPE',count(*)
            from public.messages m
            join public.workflow_bindings w on w.id=m.channel_binding_id
            join scope s on s.id=w.persona_id
            where m.direction='inbound' and m.channel='whatsapp'
              and m.created_at>=:'WINDOW_START'::timestamptz and m.created_at<:'WINDOW_END'::timestamptz
              and coalesce(m.external_message_id,'') not like 'validator:%'
              and not exists (
                select 1 from public.lead_buffer b
                where b.channel_binding_id=m.channel_binding_id and b.direction='inbound'
                  and ((m.external_message_id is not null and b.external_message_id=m.external_message_id)
                    or (m.correlation_id is not null and b.correlation_id=m.correlation_id))
              );

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'DUPLICATE_EXTERNAL_INBOUND_IDS',count(*) from (
              select b.persona_id,b.external_message_id
              from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.direction='inbound' and b.created_at>=:'WINDOW_START'::timestamptz and b.created_at<:'WINDOW_END'::timestamptz
                and nullif(b.external_message_id,'') is not null
              group by b.persona_id,b.external_message_id having count(*)>1
            ) duplicates;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG'),
            inbound as (
              select b.* from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.direction='inbound' and b.created_at>=:'WINDOW_START'::timestamptz and b.created_at<:'WINDOW_END'::timestamptz
                and coalesce(b.external_message_id,'') not like 'validator:%'
            )
            select 'INBOUND_PROOF_CONTINUITY',count(*) filter(where p.id is not null),
              count(*) filter(where p.id is not null and coalesce((p.proof_result->>'valid')::boolean,false)),
              count(*) filter(where p.id is not null and not coalesce((p.proof_result->>'valid')::boolean,false)),
              count(*) filter(where p.outbound_id is not null)
            from inbound b left join public.conversation_turn_proofs p on p.canonical_inbound_id=b.id::text;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'CURRENT_REAL_INBOUND_BACKLOG',status,count(*)
            from public.lead_buffer b join scope s on s.id=b.persona_id
            where b.direction='inbound' and b.status in ('received','buffered','retry','processing','awaiting_proof','dead_letter')
              and coalesce(b.external_message_id,'') not like 'validator:%'
              and coalesce(b.payload->>'source','') <> 'wa_validator'
            group by status order by status;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'CURRENT_BACKLOG_DETAIL',b.id,p.slug,b.status,b.created_at,b.updated_at,b.attempt_count,
              coalesce(b.external_message_id,''),left(md5(coalesce(b.lead_ref::text,'')),12)
            from public.lead_buffer b join scope s on s.id=b.persona_id join public.personas p on p.id=b.persona_id
            where b.direction='inbound' and b.status in ('received','buffered','retry','processing','awaiting_proof','dead_letter')
              and coalesce(b.external_message_id,'') not like 'validator:%'
              and coalesce(b.payload->>'source','') <> 'wa_validator'
            order by b.created_at;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'CURRENT_ORPHAN_DETAIL',b.id,p.slug,b.status,b.created_at,b.updated_at,
              b.locked_at,b.locked_by,b.attempt_count,left(coalesce(b.last_error,''),160),
              (coalesce(b.payload,'{}'::jsonb) ? 'decision_attempt_started_at'),
              (coalesce(b.payload,'{}'::jsonb) ? 'provider_attempt_started_at'),
              exists (select 1 from public.conversation_turn_proofs proof where proof.canonical_inbound_id=b.id::text),
              left(md5(coalesce(b.lead_ref::text,'')),12)
            from public.lead_buffer b join scope s on s.id=b.persona_id join public.personas p on p.id=b.persona_id
            where b.direction='inbound'
              and b.status in ('processing','awaiting_proof')
              and coalesce(b.locked_at,b.updated_at)<now()-interval '5 minutes'
            order by b.created_at;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'CURRENT_ORPHANS',
              count(*) filter(where b.status in ('processing','awaiting_proof') and coalesce(b.locked_at,b.updated_at)<now()-interval '5 minutes'),
              count(*) filter(where b.status in ('received','buffered','retry') and b.payload->'conversation_commit' is not null)
            from public.lead_buffer b join scope s on s.id=b.persona_id;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'UNPROVED_AGENT_OUTBOUND_SINCE_WINDOW',count(*)
            from public.lead_buffer b join scope s on s.id=b.persona_id
            where b.direction='outbound' and b.created_at>=:'WINDOW_START'::timestamptz
              and coalesce(b.payload->>'sender_type','')='agent'
              and not exists (select 1 from public.conversation_turn_proofs p where p.outbound_id=b.id::text and coalesce((p.proof_result->>'valid')::boolean,false));

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG'),
            projection as (
              select public.list_actionable_message_queue_v1(
                (select array_agg(id) from scope), null, null, 0, 100
              ) as data
            )
            select 'QUEUE_PROJECTION_ITEM',
              item->>'id',item->>'queue_state',item->>'status',
              case when nullif(item->>'previous_message','') is null then 0 else 1 end,
              case when nullif(item->>'last_agent_message','') is null then 0 else 1 end,
              case when jsonb_array_length(coalesce(item->'recent_context','[]'::jsonb)) > 0 then 1 else 0 end,
              left(coalesce(item->>'last_error',''),160),coalesce(item->>'actions','[]')
            from projection, lateral jsonb_array_elements(coalesce(data->'items','[]'::jsonb)) item;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG'),
            real_inbound as (
              select b.* from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.direction='inbound'
                and b.status in ('received','buffered','retry','processing','awaiting_proof','waiting_human','dead_letter')
                and coalesce(b.external_message_id,'') not like 'validator:%'
                and coalesce(b.external_message_id,'') not like 'ai_reply.validator:%'
                and coalesce(b.payload->>'source','') <> 'wa_validator'
            )
            select 'REAL_BUFFER_RECONCILIATION',
              b.id,p.slug,b.status,left(coalesce(b.last_error,''),160),
              exists (select 1 from public.system_events e where e.entity_type='lead_buffer' and e.entity_id=b.id::text and e.event_type in ('conversation.technical_failure','conversation.technical_handoff')),
              exists (select 1 from public.conversation_turn_proofs proof where proof.canonical_inbound_id=b.id::text),
              (select count(*) from public.lead_buffer o where o.direction='outbound' and o.lead_ref=b.lead_ref and o.channel_binding_id is not distinct from b.channel_binding_id),
              left(md5(coalesce(b.lead_ref::text,'')),12)
            from real_inbound b join public.personas p on p.id=b.persona_id
            order by b.created_at;
            SQL

            if [[ -n "$LEAD_REF" ]]; then
              "${compose[@]}" exec -T \
                -e PGOPTIONS='-c default_transaction_read_only=on' \
                -e PERSONA_SLUG="$PERSONA_SLUG" -e LEAD_REF="$LEAD_REF" \
                -e WINDOW_START="$WINDOW_START" -e WINDOW_END="$WINDOW_END" \
                db sh -c 'psql -v ON_ERROR_STOP=1 -v PERSONA_SLUG="$PERSONA_SLUG" -v LEAD_REF="$LEAD_REF" -v WINDOW_START="$WINDOW_START" -v WINDOW_END="$WINDOW_END" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|"' <<'SQL'
            select 'SCOPED_LEAD', p.slug, l.id, l.ai_paused,
                   right(regexp_replace(coalesce(to_jsonb(l)->>'telefone', to_jsonb(l)->>'phone', ''), '[^0-9]', '', 'g'), 4),
                   l.updated_at
            from public.leads l join public.personas p on p.id=l.persona_id
            where p.slug=:'PERSONA_SLUG' and l.id=:'LEAD_REF'::bigint;

            select 'SCOPED_MESSAGE', m.id, m.direction, m.created_at, m.status,
                   m.channel_binding_id, m.correlation_id,
                   left(regexp_replace(regexp_replace(coalesce(m.content, ''), '[+]?[0-9][0-9 ()+.-]{7,}[0-9]', '[phone]', 'g'), '(sk-[A-Za-z0-9_-]+|Bearer [A-Za-z0-9._-]+|eyJ[A-Za-z0-9._-]+)', '[credential]', 'gi'), 1500),
                   jsonb_build_object('question_kind', m.metadata->'question_kind',
                     'asked_field_key', m.metadata->'asked_field_key',
                     'graph_version', m.metadata->'graph_version',
                     'graph_checksum', m.metadata->'graph_checksum',
                     'trace_id', m.metadata->'trace_id')::text
            from public.messages m join public.leads l on l.id=m.lead_id
            join public.personas p on p.id=l.persona_id
            where p.slug=:'PERSONA_SLUG' and l.id=:'LEAD_REF'::bigint
              and m.created_at>=:'WINDOW_START'::timestamptz and m.created_at<:'WINDOW_END'::timestamptz
            order by m.created_at desc limit 20;

            select 'SCOPED_FACT', f.id, f.field_key, f.owner_node_id, f.status, f.is_current,
                   f.source_message_id, f.created_at,
                   md5(coalesce(f.value_json::text, ''))
            from public.conversation_facts f join public.conversation_ledgers l on l.id=f.ledger_id
            join public.personas p on p.id=l.persona_id
            where p.slug=:'PERSONA_SLUG' and l.lead_ref=:'LEAD_REF'::bigint
            order by f.created_at desc limit 40;

            select 'SCOPED_LEDGER', l.id, l.revision, l.journey_id,
                   to_jsonb(l)->'asked_question_node_ids', l.active_branch_node_id,
                   to_jsonb(l)->'graph_checksum'
            from public.conversation_ledgers l join public.personas p on p.id=l.persona_id
            where p.slug=:'PERSONA_SLUG' and l.lead_ref=:'LEAD_REF'::bigint;

            select 'SCOPED_BUFFER', b.id, b.direction, b.status, b.created_at, b.updated_at,
                   b.correlation_id, b.channel_binding_id,
                   jsonb_build_object('status', b.payload->'conversation_commit'->'status',
                     'decision_id', b.payload->'conversation_commit'->'decision_id',
                     'outbound_id', b.payload->'conversation_commit'->'outbound_id'),
                   jsonb_build_object('source', b.payload->'source', 'source_buffer_id', b.payload->'source_buffer_id',
                     'source_inbound_id', b.payload->'source_inbound_id',
                     'external_message_id', to_jsonb(b)->'external_message_id',
                     'question_kind', b.payload->'question_kind', 'asked_field_key', b.payload->'asked_field_key',
                     'provider_status', b.payload->'provider_status')::text
            from public.lead_buffer b join public.personas p on p.id=b.persona_id
            where p.slug=:'PERSONA_SLUG' and b.lead_ref=:'LEAD_REF'::bigint
              and b.created_at>=:'WINDOW_START'::timestamptz and b.created_at<:'WINDOW_END'::timestamptz
            order by b.created_at desc limit 30;

            select 'SCOPED_PROOF', t.canonical_inbound_id, t.outbound_id, t.created_at,
                   regexp_replace(jsonb_build_object('valid', t.proof_result->'valid',
                     'technical_pass', t.proof_result->'technical_pass', 'quality_pass', t.proof_result->'quality_pass',
                     'warnings', t.proof_result->'quality_warnings',
                     'asked_field_key', t.proof_result->'asked_field_key',
                     'missing_fields', t.proof_result->'missing_fields',
                     'accepted_facts', (select jsonb_agg(jsonb_build_object(
                       'field_key', f->'field_key', 'owner_node_id', f->'owner_node_id',
                       'status', f->'status', 'source_message_id', f->'source_message_id',
                       'value_hash', md5(coalesce((f->'value')::text, ''))))
                       from jsonb_array_elements(coalesce(t.proof_result->'accepted_facts', '[]'::jsonb)) f),
                     'question_kind', t.proof_result->'question_kind')::text, '[0-9]{9,}', '#', 'g')
            from public.conversation_turn_proofs t
            join public.lead_buffer b on b.id::text=t.canonical_inbound_id
            join public.personas p on p.id=b.persona_id
            where p.slug=:'PERSONA_SLUG' and b.lead_ref=:'LEAD_REF'::bigint
              and t.created_at>=:'WINDOW_START'::timestamptz and t.created_at<:'WINDOW_END'::timestamptz
            order by t.created_at desc limit 20;
            SQL
            fi
