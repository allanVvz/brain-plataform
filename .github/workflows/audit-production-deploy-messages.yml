name: Audit production deploy messages

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: Inclusive UTC deploy-window start
        required: true
      window_end:
        description: Exclusive UTC deploy-window end
        required: true
      persona_slug:
        description: Persona scope
        type: choice
        options: [tock-fatal, all]
        default: all

permissions:
  contents: read

concurrency:
  group: brain-ai-production-read-only
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit canonical inbound continuity without message content
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
          PERSONA_SLUG: ${{ inputs.persona_slug }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,WINDOW_START,WINDOW_END,PERSONA_SLUG
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            [[ "$PERSONA_SLUG" == all || "$PERSONA_SLUG" == tock-fatal ]]
            [[ "$WINDOW_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
            [[ "$WINDOW_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
            python3 -c 'import json; p=json.load(open(".deploy/control/claims-paused.json",encoding="utf-8")); print("CLAIMS_PAUSE_STATE="+json.dumps({k:p.get(k) for k in ("paused","reason","updated_at","created_at")},sort_keys=True))'
            compose=(docker compose --env-file .env.compose -f docker-compose.yml -f infra/microservices/docker-compose.blue-green.yml)
            "${compose[@]}" exec -T \
              -e WINDOW_START="$WINDOW_START" -e WINDOW_END="$WINDOW_END" -e PERSONA_SLUG="$PERSONA_SLUG" \
              db sh -c 'psql -v ON_ERROR_STOP=1 -v WINDOW_START="$WINDOW_START" -v WINDOW_END="$WINDOW_END" -v PERSONA_SLUG="$PERSONA_SLUG" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|"' <<'SQL'
            with scope as (
              select id from public.personas
              where :'PERSONA_SLUG' = 'all' or slug = :'PERSONA_SLUG'
            ), window_buffers as (
              select b.* from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.created_at >= :'WINDOW_START'::timestamptz
                and b.created_at < :'WINDOW_END'::timestamptz
            ), real_buffers as (
              select * from window_buffers
              where coalesce(external_message_id,'') not like 'validator:%'
                and coalesce(payload->>'source','') <> 'wa_validator'
            )
            select 'DEPLOY_WINDOW_BUFFER_STATUS',direction,status,count(*)
            from real_buffers group by direction,status order by direction,status;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG'),
            inbound as (
              select b.* from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.direction='inbound' and b.created_at>=:'WINDOW_START'::timestamptz and b.created_at<:'WINDOW_END'::timestamptz
                and coalesce(b.external_message_id,'') not like 'validator:%'
                and coalesce(b.payload->>'source','') <> 'wa_validator'
            )
            select 'DEPLOY_WINDOW_INBOUND',count(*),count(distinct lead_ref),
              count(*) filter(where status in ('received','buffered','retry')),
              count(*) filter(where status in ('processing','awaiting_proof')),
              count(*) filter(where status='dead_letter'),
              count(*) filter(where payload->'conversation_commit' is not null)
            from inbound;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG'),
            inbound as (
              select b.* from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.direction='inbound' and b.created_at>=:'WINDOW_START'::timestamptz and b.created_at<:'WINDOW_END'::timestamptz
                and coalesce(b.external_message_id,'') not like 'validator:%'
            )
            select 'INBOUND_WITHOUT_MESSAGE_PROJECTION',count(*)
            from inbound b where b.external_message_id is not null and not exists (
              select 1 from public.messages m where m.external_message_id=b.external_message_id
            );

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'DUPLICATE_EXTERNAL_INBOUND_IDS',count(*) from (
              select b.persona_id,b.external_message_id
              from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.direction='inbound' and b.created_at>=:'WINDOW_START'::timestamptz and b.created_at<:'WINDOW_END'::timestamptz
                and nullif(b.external_message_id,'') is not null
              group by b.persona_id,b.external_message_id having count(*)>1
            ) duplicates;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG'),
            inbound as (
              select b.* from public.lead_buffer b join scope s on s.id=b.persona_id
              where b.direction='inbound' and b.created_at>=:'WINDOW_START'::timestamptz and b.created_at<:'WINDOW_END'::timestamptz
                and coalesce(b.external_message_id,'') not like 'validator:%'
            )
            select 'INBOUND_PROOF_CONTINUITY',count(*) filter(where p.id is not null),
              count(*) filter(where p.id is not null and coalesce((p.proof_result->>'valid')::boolean,false)),
              count(*) filter(where p.id is not null and not coalesce((p.proof_result->>'valid')::boolean,false)),
              count(*) filter(where p.outbound_id is not null)
            from inbound b left join public.conversation_turn_proofs p on p.canonical_inbound_id=b.id::text;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'CURRENT_REAL_INBOUND_BACKLOG',status,count(*)
            from public.lead_buffer b join scope s on s.id=b.persona_id
            where b.direction='inbound' and b.status in ('received','buffered','retry','processing','awaiting_proof','dead_letter')
              and coalesce(b.external_message_id,'') not like 'validator:%'
              and coalesce(b.payload->>'source','') <> 'wa_validator'
            group by status order by status;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'CURRENT_ORPHANS',
              count(*) filter(where b.status in ('processing','awaiting_proof') and coalesce(b.locked_at,b.updated_at)<now()-interval '5 minutes'),
              count(*) filter(where b.status in ('received','buffered','retry') and b.payload->'conversation_commit' is not null)
            from public.lead_buffer b join scope s on s.id=b.persona_id;

            with scope as (select id from public.personas where :'PERSONA_SLUG'='all' or slug=:'PERSONA_SLUG')
            select 'UNPROVED_AGENT_OUTBOUND_SINCE_WINDOW',count(*)
            from public.lead_buffer b join scope s on s.id=b.persona_id
            where b.direction='outbound' and b.created_at>=:'WINDOW_START'::timestamptz
              and coalesce(b.payload->>'sender_type','')='agent'
              and not exists (select 1 from public.conversation_turn_proofs p where p.outbound_id=b.id::text and coalesce((p.proof_result->>'valid')::boolean,false));
            SQL
