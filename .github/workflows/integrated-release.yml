name: Integrated microservice release
on:
  workflow_dispatch:
    inputs:
      manifest_sha: {description: Commit containing the immutable release manifest, required: true}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.manifest_sha }}"}
      - run: python -m json.tool ops/microservices/source-import-manifest.json >/dev/null
      - run: python -m json.tool ops/microservices/route-map.json >/dev/null
      - run: python ops/microservices/validate-route-map.py
  dispatch:
    needs: validate
    environment: production-integrated-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [brain-control-plane, brain-conversation-runtime, brain-transport]
    steps:
      - run: gh workflow run release.yml -R "allanVvz/${{ matrix.repo }}" -f manifest_sha="${{ inputs.manifest_sha }}"
        env: {GH_TOKEN: "${{ secrets.MICROSERVICE_RELEASE_TOKEN }}"}
