name: Audit production environment evidence

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-ai-production-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Refresh read-only environment evidence
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            bash ops/vps/collect-environment-evidence.sh
