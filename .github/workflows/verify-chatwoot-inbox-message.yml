name: Verify Chatwoot inbox test message

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check the protected Tock Fatal projection receipt
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}"
            slot="$(python3 -c 'import json; print(json.load(open(".deploy/microservices/slots.json", encoding="utf-8"))["transport"]["active"])')"
            [[ "$slot" == blue || "$slot" == green ]]
            docker exec -i "brain-ai-transport-$slot-1" python - <<'PY'
            from datetime import datetime, timedelta, timezone
            from services import chatwoot_api, supabase_client
            from repositories import chatwoot_bridge
            from workers.chatwoot_bridge_worker import ChatwootBridgeWorker
            import re
            config = next(iter(chatwoot_api.configurations()), None)
            rows = supabase_client._execute_with_retry(supabase_client.get_client().table('messages').select('id,lead_id,direction,content,created_at').eq('direction','inbound').ilike('content','%Teste Chatwoot%').gte('created_at',(datetime.now(timezone.utc)-timedelta(hours=24)).isoformat()).order('created_at',desc=True).limit(30)).data or []
            found = projected = mapped = False
            status, attempts, error_type = 'missing', 0, 'none'
            setup_result = 'test_message_not_found'
            queue = {}
            api = chatwoot_api.ChatwootApi(config) if config else None
            try:
                for row in rows:
                    lead = supabase_client.get_lead_by_ref(int(row['lead_id'])) or {}
                    if not config or str(lead.get('channel_binding_id') or '') != config.binding_id:
                        continue
                    found = True
                    ops = supabase_client._execute_with_retry(supabase_client.get_client().table('chatwoot_bridge_operations').select('id,status,attempt_count,last_error,available_at').eq('source_kind','brain_message').eq('source_id',str(row['id'])).limit(1)).data or []
                    op = ops[0] if ops else {}
                    status = str(op.get('status') or 'missing')
                    attempts = int(op.get('attempt_count') or 0)
                    et = str(op.get('last_error') or '').split(':',1)[0]
                    error_type = et if et.replace('_','').replace('.','').isalnum() else ('other' if et else 'none')
                    mapping = chatwoot_bridge.get_conversation(config.binding_id,int(row['lead_id']))
                    mapped = bool(mapping and mapping.get('conversation_id'))
                    setup_result = 'already_mapped' if mapped else 'not_attempted'
                    if not mapped:
                        # Idempotently establish this lead's contact/conversation using
                        # the same production path; emit only a fixed reason code.
                        try:
                            mapping = ChatwootBridgeWorker()._ensure_conversation(
                                api, config, int(row['lead_id']), lead,
                            )
                            mapped = bool(mapping and mapping.get('conversation_id'))
                            setup_result = 'conversation_ready' if mapped else 'no_mapping_returned'
                        except Exception as exc:
                            detail = str(exc)
                            http = re.search(r'Chatwoot API returned HTTP ([45][0-9]{2})$', detail)
                            known = {
                                'lead phone number is unavailable': 'lead_phone_unavailable',
                                'Chatwoot contact response has no inbox session': 'contact_missing_inbox_session',
                                'Chatwoot conversation response has no id': 'conversation_missing_id',
                                'Chatwoot API returned invalid JSON': 'chatwoot_invalid_json',
                            }
                            setup_result = ('chatwoot_http_' + http.group(1)) if http else known.get(detail, 'setup_error_' + type(exc).__name__)
                    if mapped:
                        conversation_id = int(mapping['conversation_id'])
                        source_id = f"brain-message:{row['id']}"
                        existing = api.find_message_by_source_id(
                            conversation_id=conversation_id, source_id=source_id, after_message_id=0,
                        )
                        projected = bool(existing)
                        if not projected and status == 'retry':
                            try:
                                available_at = datetime.fromisoformat(
                                    str(op.get('available_at') or '').replace('Z', '+00:00'),
                                )
                                retry_wait = (available_at - datetime.now(timezone.utc)).total_seconds()
                            except (TypeError, ValueError):
                                retry_wait = 0
                            if retry_wait > 60:
                                try:
                                    created = api.create_message(
                                        conversation_id=conversation_id,
                                        source_id=source_id,
                                        content=str(row.get('content') or '').strip(),
                                        incoming=True,
                                        external_created_at=str(row.get('created_at') or '') or None,
                                        content_attributes={
                                            'brain_message_id': int(row['id']),
                                            'brain_sender_origin': 'customer',
                                            'brain_status': '',
                                        },
                                    )
                                    projected = bool(created.get('id'))
                                    setup_result = 'message_reconciled' if projected else 'message_response_missing_id'
                                except Exception as exc:
                                    detail = str(exc)
                                    http = re.search(r'Chatwoot API returned HTTP ([45][0-9]{2})$', detail)
                                    setup_result = ('message_http_' + http.group(1)) if http else 'message_error_' + type(exc).__name__
                            else:
                                setup_result = 'retry_due_or_too_close'
                        if projected and status == 'retry':
                            released = supabase_client._execute_with_retry(
                                supabase_client.get_client().table('chatwoot_bridge_operations')
                                .update({'available_at': datetime.now(timezone.utc).isoformat()})
                                .eq('id', str(op['id'])).eq('status', 'retry').select('id'),
                            ).data or []
                            setup_result += '_retry_released' if released else '_retry_not_changed'
                    break
                if config:
                    states = supabase_client._execute_with_retry(supabase_client.get_client().table('chatwoot_bridge_operations').select('status').eq('channel_binding_id',config.binding_id).eq('source_kind','brain_message').in_('status',['pending','retry','processing','dead_letter']).limit(1000)).data or []
                    for item in states:
                        key = str(item.get('status') or 'unknown')
                        queue[key] = queue.get(key,0)+1
            finally:
                if api: api.close()
            print('test_message_in_tock_fatal_backend='+str(found).lower())
            print('test_message_conversation_mapping='+str(mapped).lower())
            print('test_message_projection_status='+status)
            print('test_message_projection_attempts='+str(attempts))
            print('test_message_projection_error_type='+error_type)
            print('test_message_conversation_setup='+setup_result)
            print('chatwoot_bridge_nonterminal_sample='+','.join(f'{k}:{queue[k]}' for k in sorted(queue)))
            print('test_message_in_chatwoot_inbox='+str(projected).lower())
            if config: print('chatwoot_inbox_id='+str(config.inbox_id))
            PY
