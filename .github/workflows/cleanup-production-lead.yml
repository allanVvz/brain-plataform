name: Cleanup one production lead conversation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Audit only or apply the reviewed single-lead cleanup without a global pause
        type: choice
        options: [dry-run, apply]
        default: dry-run
      scope:
        description: Conversation preserves the lead and immutable consent; lead removes the lead only when no immutable consent exists
        type: choice
        options: [conversation, lead]
        default: conversation
      persona_slug:
        description: Persona that owns the lead
        type: choice
        options: [tock-fatal, aurora, vz-lupas]
        required: true
      lead_ref:
        description: Exact numeric lead id
        required: true
      expected_name:
        description: Case-insensitive name fragment required as a safety gate
        required: true

permissions:
  contents: read

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Audit or clean exactly one scoped lead
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          CLEANUP_ACTION: ${{ inputs.action }}
          CLEANUP_SCOPE: ${{ inputs.scope }}
          PERSONA_SLUG: ${{ inputs.persona_slug }}
          LEAD_REF: ${{ inputs.lead_ref }}
          EXPECTED_NAME: ${{ inputs.expected_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,CLEANUP_ACTION,CLEANUP_SCOPE,PERSONA_SLUG,LEAD_REF,EXPECTED_NAME
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            [[ "$CLEANUP_ACTION" == dry-run || "$CLEANUP_ACTION" == apply ]]
            [[ "$CLEANUP_SCOPE" == conversation || "$CLEANUP_SCOPE" == lead ]]
            [[ "$LEAD_REF" =~ ^[1-9][0-9]*$ ]]
            [[ "$PERSONA_SLUG" =~ ^[a-z0-9-]+$ ]]
            [[ -n "$EXPECTED_NAME" && ${#EXPECTED_NAME} -le 120 ]]
            compose=(docker compose --env-file .env.compose -f docker-compose.yml -f infra/microservices/docker-compose.blue-green.yml)
            psql=("${compose[@]}" exec -T db sh -c 'exec psql -v ON_ERROR_STOP=1 -Atq -U "$POSTGRES_USER" -d "$POSTGRES_DB"')

            audit="$(printf '%s\n' "
            WITH target AS (
              SELECT l.id,l.persona_id,l.nome AS name,l.metadata,p.slug AS persona_slug
                FROM public.leads l JOIN public.personas p ON p.id=l.persona_id
               WHERE l.id=${LEAD_REF}
            ), ledgers AS (
              SELECT id FROM public.conversation_ledgers WHERE lead_ref=${LEAD_REF}
            )
            SELECT jsonb_build_object(
              'lead_ref',${LEAD_REF},
              'scope','${CLEANUP_SCOPE}',
              'target_count',(SELECT count(*) FROM target),
              'persona_slug',(SELECT persona_slug FROM target),
              'name',(SELECT name FROM target),
              'name_matches',coalesce((SELECT position(lower('$(printf '%s' "$EXPECTED_NAME" | sed "s/'/''/g")') in lower(coalesce(name,'')))>0 FROM target),false),
              'messages',(SELECT count(*) FROM public.messages WHERE lead_id=${LEAD_REF}),
              'immutable_consent_messages',(SELECT count(*) FROM public.messages m WHERE m.lead_id=${LEAD_REF} AND EXISTS (SELECT 1 FROM public.contact_consents c WHERE c.lead_id=${LEAD_REF} AND (c.request_message_id=m.id OR c.response_message_id=m.id))),
              'deletable_messages',(SELECT count(*) FROM public.messages m WHERE m.lead_id=${LEAD_REF} AND NOT EXISTS (SELECT 1 FROM public.contact_consents c WHERE c.lead_id=${LEAD_REF} AND (c.request_message_id=m.id OR c.response_message_id=m.id))),
              'buffers',(SELECT count(*) FROM public.lead_buffer WHERE lead_ref=${LEAD_REF}),
              'active_buffers',(SELECT count(*) FROM public.lead_buffer WHERE lead_ref=${LEAD_REF} AND status IN ('processing','awaiting_proof')),
              'ledgers',(SELECT count(*) FROM ledgers),
              'proofs',(SELECT count(*) FROM public.conversation_turn_proofs WHERE ledger_id IN (SELECT id FROM ledgers)),
              'journeys',(SELECT count(*) FROM public.conversation_journeys WHERE lead_ref=${LEAD_REF}),
              'conversions',(SELECT count(*) FROM public.sales_conversions WHERE lead_ref=${LEAD_REF}),
              'memberships',(SELECT count(*) FROM public.lead_audience_memberships WHERE lead_id=${LEAD_REF}),
              'campaign_recipients',(SELECT count(*) FROM public.campaign_recipients WHERE lead_id=${LEAD_REF}),
              'contact_consents',(SELECT count(*) FROM public.contact_consents WHERE lead_id=${LEAD_REF}),
              'assets',(SELECT count(*) FROM public.assets WHERE lead_id=${LEAD_REF}),
              'conversation_metadata_keys',(SELECT coalesce(jsonb_agg(key ORDER BY key), '[]'::jsonb)
                FROM jsonb_object_keys(coalesce((SELECT metadata FROM target), '{}'::jsonb)) AS key
                WHERE key IN ('conversation_state','conversation_runtime','qualification','handoff_reason','commercial_note_projection','lp_image_upload_previous_handoff_level'))
            );" | "${psql[@]}")"
            echo "LEAD_CLEANUP_AUDIT=$audit"
            python3 -c 'import json,sys; row=json.loads(sys.argv[1]); scope=sys.argv[3]; assert row["target_count"] == 1, row; assert row["persona_slug"] == sys.argv[2], row; assert row["name_matches"] is True, row; assert row["active_buffers"] == 0, row; assert scope != "lead" or row["contact_consents"] == 0, "lead deletion blocked by immutable contact consents: " + json.dumps(row, sort_keys=True)' "$audit" "$PERSONA_SLUG" "$CLEANUP_SCOPE"
            [[ "$CLEANUP_ACTION" == apply ]] || { echo "LEAD_CLEANUP_DRY_RUN=passed"; exit 0; }

            printf '%s\n' "
            BEGIN;
            -- This is the same short-lived lock used by claim_whatsapp_buffer.
            -- It serializes one cleanup with claim selection without pausing
            -- workers or unrelated personas. Existing in-flight work makes the
            -- transaction fail below rather than being deleted underneath it.
            SELECT pg_advisory_xact_lock(hashtext('claim_whatsapp_buffer:v3'));
            SELECT pg_advisory_xact_lock(hashtextextended('${PERSONA_SLUG}:${LEAD_REF}',0));
            DO \$\$
            DECLARE v_lead_id bigint; v_active_buffers bigint;
            BEGIN
              SELECT l.id INTO v_lead_id
                FROM public.leads l JOIN public.personas p ON p.id=l.persona_id
               WHERE l.id=${LEAD_REF} AND p.slug='${PERSONA_SLUG}'
                 AND position(lower('$(printf '%s' "$EXPECTED_NAME" | sed "s/'/''/g")') in lower(coalesce(l.nome,'')))>0
               FOR UPDATE OF l;
              IF v_lead_id IS NULL THEN RAISE EXCEPTION 'lead cleanup scope changed'; END IF;
              SELECT count(*) INTO v_active_buffers
                FROM public.lead_buffer
               WHERE lead_ref=v_lead_id AND status IN ('processing','awaiting_proof');
              IF v_active_buffers <> 0 THEN
                RAISE EXCEPTION 'lead cleanup has active buffer rows: %', v_active_buffers;
              END IF;
            END \$\$;
            DELETE FROM public.conversation_turn_proofs
             WHERE ledger_id IN (SELECT id FROM public.conversation_ledgers WHERE lead_ref=${LEAD_REF});
            DELETE FROM public.sales_conversions WHERE lead_ref=${LEAD_REF};
            DELETE FROM public.conversation_ledgers WHERE lead_ref=${LEAD_REF};
            DELETE FROM public.conversation_journeys WHERE lead_ref=${LEAD_REF};
            DELETE FROM public.lead_buffer WHERE lead_ref=${LEAD_REF};
            -- Consent evidence is append-only. It is deliberately retained,
            -- but is disconnected from all agent state by the deletions above.
            DELETE FROM public.messages m
             WHERE m.lead_id=${LEAD_REF}
               AND NOT EXISTS (
                 SELECT 1 FROM public.contact_consents c
                  WHERE c.lead_id=${LEAD_REF}
                    AND (c.request_message_id=m.id OR c.response_message_id=m.id)
               );
            DELETE FROM public.chat_history
             WHERE session_id='${LEAD_REF}' OR session_id='${PERSONA_SLUG}:${LEAD_REF}';
            DO \$\$
            BEGIN
              IF '${CLEANUP_SCOPE}' = 'conversation' THEN
                UPDATE public.leads
                   SET metadata = coalesce(metadata, '{}'::jsonb)
                         - ARRAY['conversation_state','conversation_runtime','qualification','handoff_reason','commercial_note_projection','lp_image_upload_previous_handoff_level'],
                       stage = 'novo',
                       interesse_produto = NULL,
                       ultima_mensagem = NULL,
                       handoff_level = 'none',
                       ai_paused = false,
                       updated_at = now()
                 WHERE id=${LEAD_REF};
              ELSE
                DELETE FROM public.lead_audience_memberships WHERE lead_id=${LEAD_REF};
                DELETE FROM public.campaign_recipients WHERE lead_id=${LEAD_REF};
                UPDATE public.lead_import_rows SET lead_id=NULL WHERE lead_id=${LEAD_REF};
                UPDATE public.assets SET lead_id=NULL WHERE lead_id=${LEAD_REF};
                DELETE FROM public.system_events
                 WHERE (entity_type='lead' AND entity_id::text='${LEAD_REF}')
                    OR payload->>'lead_ref'='${LEAD_REF}';
                DELETE FROM public.leads WHERE id=${LEAD_REF};
              END IF;
            END \$\$;
            COMMIT;
            " | "${psql[@]}"
            remaining="$(printf '%s\n' "SELECT jsonb_build_object('lead_count',count(*),'messages',(SELECT count(*) FROM public.messages WHERE lead_id=${LEAD_REF}),'immutable_consent_messages',(SELECT count(*) FROM public.messages m WHERE m.lead_id=${LEAD_REF} AND EXISTS (SELECT 1 FROM public.contact_consents c WHERE c.lead_id=${LEAD_REF} AND (c.request_message_id=m.id OR c.response_message_id=m.id))),'buffers',(SELECT count(*) FROM public.lead_buffer WHERE lead_ref=${LEAD_REF}),'ledgers',(SELECT count(*) FROM public.conversation_ledgers WHERE lead_ref=${LEAD_REF}),'conversation_metadata_keys',(SELECT coalesce(jsonb_agg(key ORDER BY key), '[]'::jsonb) FROM jsonb_object_keys(coalesce((SELECT metadata FROM public.leads WHERE id=${LEAD_REF}), '{}'::jsonb)) AS key WHERE key IN ('conversation_state','conversation_runtime','qualification','handoff_reason','commercial_note_projection','lp_image_upload_previous_handoff_level'))) FROM public.leads l WHERE l.id=${LEAD_REF};" | "${psql[@]}")"
            echo "LEAD_CLEANUP_REMAINING=$remaining"
            python3 -c 'import json,sys; row=json.loads(sys.argv[1]); scope=sys.argv[2]; assert row["messages"] == row["immutable_consent_messages"], row; assert row["buffers"] == row["ledgers"] == 0, row; assert row["conversation_metadata_keys"] == [], row; assert (row["lead_count"] == 1) if scope == "conversation" else (row["lead_count"] == 0), row' "$remaining" "$CLEANUP_SCOPE"
            echo "LEAD_CLEANUP_APPLY=passed scope=$CLEANUP_SCOPE lead_ref=$LEAD_REF persona_slug=$PERSONA_SLUG claim_scope=transactional"
