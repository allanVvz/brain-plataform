name: Read persona graph structure (read-only)
on:
  workflow_dispatch:
    inputs:
      persona_slug:
        type: choice
        options: [utzig-garage, tock-fatal]
        required: true
permissions:
  contents: read
concurrency:
  group: brain-ai-production-read-only
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read canonical publications and exact restart candidates
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          PERSONA_SLUG: ${{ inputs.persona_slug }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PERSONA_SLUG
          command_timeout: 2m
          script: |
            set -Eeuo pipefail
            [[ "$PERSONA_SLUG" =~ ^(utzig-garage|tock-fatal)$ ]]
            docker exec -i -e PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=30000' -e PERSONA_SLUG="$PERSONA_SLUG" brain-ai-db-1 sh -c 'exec psql -X -Atq -v ON_ERROR_STOP=1 -v slug="$PERSONA_SLUG" -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            WITH snapshot AS (
              SELECT public.read_graph_editor_publication_v1(id) AS value FROM public.personas WHERE slug=:'slug'
            ), document AS (
              SELECT value->'publication' AS publication,(value->>'document_text')::jsonb AS doc FROM snapshot
            )
            SELECT 'SDR_GRAPH_AUDIT=' || regexp_replace(jsonb_build_object(
              'slug',:'slug','publication',publication,'common_contract',doc->'common_contract',
              'branch_contracts',doc->'branch_contracts',
              'behavior_nodes',(SELECT jsonb_agg(n) FROM jsonb_array_elements(doc->'nodes') n WHERE n->>'node_type' IN ('persona','tone','tone_of_voice','rule','brand')),
              'question_nodes',(SELECT jsonb_agg(n) FROM jsonb_array_elements(doc->'nodes') n WHERE n->>'node_type'='faq')
            )::text,'[0-9]{9,}','[masked]','g') FROM document;
            SELECT 'SDR_LEAD_AUDIT=' || jsonb_build_object(
              'id',l.id,'name',l.nome,'persona_id',l.persona_id,'persona_slug',p.slug,
              'phone_last4',right(l.telefone,4),'created_at',l.created_at,'updated_at',l.updated_at,
              'buffer_bindings',(SELECT jsonb_agg(DISTINCT b.channel_binding_id) FROM public.lead_buffer b WHERE b.lead_ref=l.id AND b.persona_id=l.persona_id),
              'active_buffers',(SELECT count(*) FROM public.lead_buffer b WHERE b.lead_ref=l.id AND b.status IN ('processing','awaiting_proof')),
              'buffers',(SELECT count(*) FROM public.lead_buffer b WHERE b.lead_ref=l.id),
              'messages',(SELECT count(*) FROM public.messages m WHERE m.lead_id=l.id),
              'last_message_at',(SELECT max(m.created_at) FROM public.messages m WHERE m.lead_id=l.id)
            )::text FROM public.leads l JOIN public.personas p ON p.id=l.persona_id
             WHERE p.slug=:'slug' AND right(l.telefone,4)='8510';
            SQL
