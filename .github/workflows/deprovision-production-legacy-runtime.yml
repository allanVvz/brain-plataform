name: Deprovision production legacy runtime

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inventory or retire only the legacy API/worker containers and cached images
        type: choice
        options: [dry-run, deprovision]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Synchronize approved retirement control
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/vps/deprovision-legacy-runtime.sh
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Inventory or retire legacy runtime
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AUDIT_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          LEGACY_ACTION: ${{ inputs.action }}
          LEGACY_DEPROVISION_AUTHORIZED: ${{ inputs.action == 'deprovision' && 'true' || 'false' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AUDIT_ROOT,LEGACY_ACTION,LEGACY_DEPROVISION_AUTHORIZED
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "$AUDIT_ROOT"
            mode=--dry-run
            [[ "$LEGACY_ACTION" == "deprovision" ]] && mode=--apply
            bash ops/vps/deprovision-legacy-runtime.sh "$mode"
