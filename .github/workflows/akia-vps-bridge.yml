name: AKIA OS VPS bridge (manual)
on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        options: [operations-api, gateway, north-runtime]
        required: true
      action:
        type: choice
        options: [preflight, deploy, activate]
        default: preflight
        required: true
      image:
        description: Immutable ghcr.io/allanvvz/akia-<service>@sha256:<digest>
        required: true
        type: string
      skip_tests:
        description: Explicit authorization to skip suites and smoke fixtures; retain syntax and readiness
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: akia-os-vps-bridge
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check release controls
        run: |
          for script in ops/akia-bridge/*.sh; do bash -n "$script"; done
          node --check ops/akia-bridge/north-activation-smoke.mjs
          if [[ "${{ inputs.skip_tests }}" != true ]]; then python3 ops/akia-bridge/test-release-controls.py; fi
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('ops/akia-bridge/north-gateway-activation-smoke.py').read_text())"
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('ops/akia-bridge/north-gateway-crm-smoke.py').read_text())"
      - name: Restrict image and action
        env:
          SERVICE: ${{ inputs.service }}
          ACTION: ${{ inputs.action }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail
          [[ "$SERVICE" == operations-api || "$SERVICE" == gateway || "$SERVICE" == north-runtime ]]
          [[ "$ACTION" == preflight || "$ACTION" == deploy || "$ACTION" == activate ]]
          [[ "$ACTION" != activate || "$SERVICE" != north-runtime ]]
          [[ "$IMAGE" =~ ^ghcr\.io/allanvvz/akia-${SERVICE}@sha256:[0-9a-f]{64}$ ]]
  preflight:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Read-only AKIA prerequisites on the Brain VPS
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AKIA_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          AKIA_SERVICE: ${{ inputs.service }}
          AKIA_ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AKIA_ROOT,AKIA_SERVICE,AKIA_ACTION
          command_timeout: 3m
          script: |
            set -Eeuo pipefail
            test -s "$AKIA_ROOT/.env.compose"
            docker_root="$(docker info --format '{{.DockerRootDir}}')"
            df -P "$AKIA_ROOT" "$docker_root"
            for path in "$AKIA_ROOT" "$docker_root"; do
              used="$(df -P "$path" | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
              [[ "$used" =~ ^[0-9]+$ ]] && (( used < 50 )) || {
                echo "AKIA_DISK_GATE=fail path=$path used=${used:-unknown}% required=<50%"; exit 1;
              }
            done
            echo 'AKIA_DISK_GATE=pass required=<50%'
            env_path="$AKIA_ROOT/secrets/akia-operations.env"
            if [[ "$AKIA_SERVICE" == gateway ]]; then env_path="$AKIA_ROOT/secrets/akia-gateway.env"; fi
            if [[ "$AKIA_SERVICE" == north-runtime ]]; then env_path="$AKIA_ROOT/secrets/akia-north-runtime.env"; fi
            if [[ -s "$env_path" ]]; then
              echo "AKIA_PRIVATE_ENV=present service=$AKIA_SERVICE"
            else
              echo "AKIA_PRIVATE_ENV=missing service=$AKIA_SERVICE"
              [[ "$AKIA_ACTION" == preflight ]] || exit 1
            fi
            cd "$AKIA_ROOT"
            db_container="$(docker compose --env-file .env.compose -f docker-compose.yml ps -q db)"
            [[ -n "$db_container" ]] || { echo 'AKIA_DB_CONTAINER=missing'; exit 1; }
            db_network="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$db_container" | head -n 1)"
            [[ -n "$db_network" ]] || { echo 'AKIA_DB_NETWORK=missing'; exit 1; }
            echo "AKIA_DB_NETWORK=present name=$db_network"
            python3 - <<'PY'
            import json, urllib.request
            with urllib.request.urlopen('https://api.vzforeal.com/health/ready', timeout=10) as response:
                body = json.load(response)
            if not body.get('ready') and body.get('status') != 'ready':
                raise SystemExit('AKIA_BRAIN_READINESS=fail')
            print('AKIA_BRAIN_READINESS=pass source_sha=' + str(body.get('source_sha', 'unknown')))
            PY
            echo 'AKIA_PREFLIGHT=read_only_complete'
  deploy:
    if: inputs.action == 'deploy' || inputs.action == 'activate'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify selected image and package access before VPS writes
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          AKIA_IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GHCR_USERNAME" && -n "$GHCR_TOKEN" ]]
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -f "$DOCKER_CONFIG/config.json"; rmdir "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
          docker manifest inspect "$AKIA_IMAGE" >/dev/null
      - name: Sync AKIA release controls only
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/akia-bridge,infra/akia/compose.yml,infra/akia/gateway.compose.yml,infra/akia/north-runtime.compose.yml
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Candidate, readiness, selected-service cutover and rollback
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AKIA_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          AKIA_SERVICE: ${{ inputs.service }}
          AKIA_IMAGE: ${{ inputs.image }}
          AKIA_ACTION: ${{ inputs.action }}
          AKIA_SKIP_SMOKE: ${{ inputs.skip_tests }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          AKIA_PORTAL_PATH_HOST: api.vzforeal.com
          AKIA_PORTAL_PATH_ORIGINS: '{"north":["https://north-portal.pages.dev","https://test.north-portal.pages.dev","https://north-original-review.north-portal.pages.dev"],"south":"https://south-portal.pages.dev","akia":["https://akia-os.pages.dev","https://test.akia-os.pages.dev"]}'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AKIA_ROOT,AKIA_SERVICE,AKIA_ACTION,AKIA_SKIP_SMOKE,AKIA_IMAGE,GHCR_USERNAME,GHCR_TOKEN,AKIA_PORTAL_PATH_HOST,AKIA_PORTAL_PATH_ORIGINS
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            [[ "$AKIA_IMAGE" =~ ^ghcr\.io/allanvvz/akia-${AKIA_SERVICE}@sha256:[0-9a-f]{64}$ ]]
            cd "$AKIA_ROOT"
            export AKIA_NORTH_RUNTIME_FIXTURE_FILE="$AKIA_ROOT/secrets/north-e2e-fixture.json"
            if [[ "$AKIA_SERVICE" == north-runtime ]]; then
              export AKIA_NORTH_RUNTIME_ENV_FILE="$AKIA_ROOT/secrets/akia-north-runtime.env"
              release_script=ops/akia-bridge/deploy-akia-north-runtime.sh
            elif [[ "$AKIA_SERVICE" == gateway ]]; then
              export AKIA_GATEWAY_ENV_FILE="$AKIA_ROOT/secrets/akia-gateway.env"
              release_script=ops/akia-bridge/deploy-akia-gateway.sh
            else
              export AKIA_OPERATIONS_ENV_FILE="$AKIA_ROOT/secrets/akia-operations.env"
              release_script=ops/akia-bridge/deploy-akia-operations.sh
            fi
            [[ -n "${GHCR_TOKEN:-}" && -n "${GHCR_USERNAME:-}" ]]
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -f "$DOCKER_CONFIG/config.json"; rmdir "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
            if [[ "$AKIA_ACTION" == activate ]]; then
              bash "$release_script" --activation-plan "$AKIA_IMAGE"
              timeout --signal=TERM --kill-after=120s 420s bash "$release_script" --activate "$AKIA_IMAGE"
            else
              bash "$release_script" --dry-run "$AKIA_IMAGE"
              timeout --signal=TERM --kill-after=120s 420s bash "$release_script" --apply "$AKIA_IMAGE"
            fi
            echo "AKIA_BRIDGE_RESULT=healthy service=$AKIA_SERVICE"
