name: AKIA OS VPS bridge (manual)
on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        options: [operations-api, gateway]
        required: true
      action:
        type: choice
        options: [preflight, bootstrap-prepare, bootstrap-apply, deploy, route-dry-run, route-apply, registry-dry-run, registry-apply]
        default: preflight
        required: true
      image:
        description: Immutable ghcr.io/allanvvz/akia-<service>@sha256:<digest>
        required: true
        type: string
      reviewed_sql_sha256:
        description: Exact private SQL digest from bootstrap-prepare (bootstrap-apply only)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: akia-os-vps-bridge
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict image and action
        env:
          SERVICE: ${{ inputs.service }}
          ACTION: ${{ inputs.action }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail
          [[ "$SERVICE" == operations-api || "$SERVICE" == gateway ]]
          [[ "$ACTION" == preflight || "$ACTION" == bootstrap-prepare || "$ACTION" == bootstrap-apply || "$ACTION" == deploy || "$ACTION" == route-dry-run || "$ACTION" == route-apply || "$ACTION" == registry-dry-run || "$ACTION" == registry-apply ]]
          [[ "$IMAGE" =~ ^ghcr\.io/allanvvz/akia-${SERVICE}@sha256:[0-9a-f]{64}$ ]]
  preflight:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Read-only AKIA prerequisites on the Brain VPS
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AKIA_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          AKIA_SERVICE: ${{ inputs.service }}
          AKIA_ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AKIA_ROOT,AKIA_SERVICE,AKIA_ACTION
          command_timeout: 3m
          script: |
            set -Eeuo pipefail
            test -s "$AKIA_ROOT/.env.compose"
            docker_root="$(docker info --format '{{.DockerRootDir}}')"
            df -P "$AKIA_ROOT" "$docker_root"
            for path in "$AKIA_ROOT" "$docker_root"; do
              used="$(df -P "$path" | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
              [[ "$used" =~ ^[0-9]+$ ]] && (( used < 50 )) || {
                echo "AKIA_DISK_GATE=fail path=$path used=${used:-unknown}% required=<50%"; exit 1;
              }
            done
            echo 'AKIA_DISK_GATE=pass required=<50%'
            env_path="$AKIA_ROOT/secrets/akia-operations.env"
            if [[ "$AKIA_SERVICE" == gateway ]]; then env_path="$AKIA_ROOT/secrets/akia-gateway.env"; fi
            if [[ -s "$env_path" ]]; then
              echo "AKIA_PRIVATE_ENV=present service=$AKIA_SERVICE"
            else
              echo "AKIA_PRIVATE_ENV=missing service=$AKIA_SERVICE"
              [[ "$AKIA_ACTION" != deploy ]] || exit 1
            fi
            cd "$AKIA_ROOT"
            db_container="$(docker compose --env-file .env.compose -f docker-compose.yml ps -q db)"
            [[ -n "$db_container" ]] || { echo 'AKIA_DB_CONTAINER=missing'; exit 1; }
            db_network="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$db_container" | head -n 1)"
            [[ -n "$db_network" ]] || { echo 'AKIA_DB_NETWORK=missing'; exit 1; }
            echo "AKIA_DB_NETWORK=present name=$db_network"
            python3 - <<'PY'
            import json, urllib.request
            with urllib.request.urlopen('https://api.vzforeal.com/health/ready', timeout=10) as response:
                body = json.load(response)
            if not body.get('ready') and body.get('status') != 'ready':
                raise SystemExit('AKIA_BRAIN_READINESS=fail')
            print('AKIA_BRAIN_READINESS=pass source_sha=' + str(body.get('source_sha', 'unknown')))
            PY
            echo 'AKIA_PREFLIGHT=read_only_complete'
  bootstrap:
    if: inputs.action == 'bootstrap-prepare' || inputs.action == 'bootstrap-apply'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Sync additive bootstrap controls only
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/akia-bridge/prepare-first-north.py,ops/akia-bridge/000_north_read_through.sql
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Prepare private configuration or apply exact reviewed SQL
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AKIA_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          AKIA_ACTION: ${{ inputs.action }}
          REVIEWED_SQL_SHA256: ${{ inputs.reviewed_sql_sha256 }}
          NORTH_SUPABASE_URL: ${{ secrets.AKIA_NORTH_SUPABASE_URL }}
          NORTH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AKIA_NORTH_SUPABASE_SERVICE_ROLE_KEY }}
          AKIA_BOOTSTRAP_MANIFEST: ${{ secrets.AKIA_BOOTSTRAP_MANIFEST }}
          AKIA_PORTAL_PATH_ORIGINS: '{"north":"https://north-portal.pages.dev","south":"https://south-portal.pages.dev","akia":"https://akia-os.pages.dev"}'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AKIA_ROOT,AKIA_ACTION,REVIEWED_SQL_SHA256,NORTH_SUPABASE_URL,NORTH_SUPABASE_SERVICE_ROLE_KEY,AKIA_BOOTSTRAP_MANIFEST,AKIA_PORTAL_PATH_ORIGINS
          command_timeout: 3m
          script: |
            set -Eeuo pipefail
            cd "$AKIA_ROOT"
            args=(--brain-root "$AKIA_ROOT" --portal-origins "$AKIA_PORTAL_PATH_ORIGINS")
            if [[ "$AKIA_ACTION" == bootstrap-prepare ]]; then
              python3 ops/akia-bridge/prepare-first-north.py "${args[@]}"
              python3 ops/akia-bridge/prepare-first-north.py "${args[@]}" --write
            else
              [[ "$REVIEWED_SQL_SHA256" =~ ^[0-9a-f]{64}$ ]]
              python3 ops/akia-bridge/prepare-first-north.py "${args[@]}" --apply-sql --reviewed-sql-sha256 "$REVIEWED_SQL_SHA256"
            fi
  registry:
    if: inputs.action == 'registry-dry-run' || inputs.action == 'registry-apply'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Sync additive registry controls
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/akia-bridge/extend-north-registry.py,ops/akia-bridge/extend-north-registry-vps.py
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Rehearse transaction and optionally commit exact reviewed registry
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AKIA_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          AKIA_ACTION: ${{ inputs.action }}
          REVIEWED_SQL_SHA256: ${{ inputs.reviewed_sql_sha256 }}
          AKIA_EXPANDED_CLIENTS_MANIFEST: ${{ secrets.AKIA_EXPANDED_CLIENTS_MANIFEST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AKIA_ROOT,AKIA_ACTION,REVIEWED_SQL_SHA256,AKIA_EXPANDED_CLIENTS_MANIFEST
          command_timeout: 3m
          script: |
            set -Eeuo pipefail
            cd "$AKIA_ROOT"
            args=(--brain-root "$AKIA_ROOT" --generator ops/akia-bridge/extend-north-registry.py --reviewed-sha256 "$REVIEWED_SQL_SHA256")
            if [[ "$AKIA_ACTION" == registry-apply ]]; then args+=(--apply); fi
            python3 ops/akia-bridge/extend-north-registry-vps.py "${args[@]}"
  portal-route:
    if: inputs.action == 'route-dry-run' || inputs.action == 'route-apply'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Sync one reversible route control
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/akia-bridge/activate-portal-route.py,ops/akia-bridge/north-internal-smoke.mjs
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Validate isolated prefix and optionally activate with rollback
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AKIA_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          AKIA_ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AKIA_ROOT,AKIA_ACTION
          command_timeout: 3m
          script: |
            set -Eeuo pipefail
            cd "$AKIA_ROOT"
            python3 ops/akia-bridge/activate-portal-route.py --brain-root "$AKIA_ROOT" --dry-run
            if [[ "$AKIA_ACTION" == route-apply ]]; then
              operations_container="$(docker ps -q --filter label=com.docker.compose.project=brain-ai --filter label=com.docker.compose.service=operations-api)"
              [[ -n "$operations_container" ]]
              docker exec -i "$operations_container" node --input-type=module < ops/akia-bridge/north-internal-smoke.mjs
              python3 ops/akia-bridge/activate-portal-route.py --brain-root "$AKIA_ROOT" --apply
            fi
  deploy:
    if: inputs.action == 'deploy'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify selected image and package access before VPS writes
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          AKIA_IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GHCR_USERNAME" && -n "$GHCR_TOKEN" ]]
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -f "$DOCKER_CONFIG/config.json"; rmdir "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
          docker manifest inspect "$AKIA_IMAGE" >/dev/null
      - name: Sync AKIA release controls only
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/akia-bridge/deploy-akia-operations.sh,ops/akia-bridge/deploy-akia-gateway.sh,ops/akia-bridge/north-internal-smoke.mjs,infra/akia/compose.yml,infra/akia/gateway.compose.yml
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Candidate, readiness, selected-service cutover and rollback
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          AKIA_ROOT: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          AKIA_SERVICE: ${{ inputs.service }}
          AKIA_IMAGE: ${{ inputs.image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          AKIA_PORTAL_PATH_HOST: api.vzforeal.com
          AKIA_PORTAL_PATH_ORIGINS: '{"north":"https://north-portal.pages.dev","south":"https://south-portal.pages.dev","akia":"https://akia-os.pages.dev"}'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:bB5eg8WRYnDC4DgAsZbINfvwW7CmhIo9Jze22YhWHRY
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AKIA_ROOT,AKIA_SERVICE,AKIA_IMAGE,GHCR_USERNAME,GHCR_TOKEN,AKIA_PORTAL_PATH_HOST,AKIA_PORTAL_PATH_ORIGINS
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            [[ "$AKIA_IMAGE" =~ ^ghcr\.io/allanvvz/akia-${AKIA_SERVICE}@sha256:[0-9a-f]{64}$ ]]
            cd "$AKIA_ROOT"
            if [[ "$AKIA_SERVICE" == gateway ]]; then
              export AKIA_GATEWAY_ENV_FILE="$AKIA_ROOT/secrets/akia-gateway.env"
              release_script=ops/akia-bridge/deploy-akia-gateway.sh
            else
              export AKIA_OPERATIONS_ENV_FILE="$AKIA_ROOT/secrets/akia-operations.env"
              export AKIA_OPERATIONS_SMOKE_SCRIPT="$AKIA_ROOT/ops/akia-bridge/north-internal-smoke.mjs"
              release_script=ops/akia-bridge/deploy-akia-operations.sh
            fi
            [[ -n "${GHCR_TOKEN:-}" && -n "${GHCR_USERNAME:-}" ]]
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -f "$DOCKER_CONFIG/config.json"; rmdir "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
            bash "$release_script" --dry-run "$AKIA_IMAGE"
            bash "$release_script" --apply "$AKIA_IMAGE"
            echo "AKIA_BRIDGE_RESULT=healthy service=$AKIA_SERVICE"
