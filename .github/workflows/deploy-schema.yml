name: Deploy schema
on:
  workflow_dispatch:
    inputs:
      manifest_sha: {description: Integrated release manifest SHA, required: true}
      apply: {description: Apply approved expand-compatible migrations, type: boolean, default: false}
jobs:
  review:
    environment: production-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m json.tool ops/microservices/source-import-manifest.json >/dev/null
      - name: Dry-run only
        if: inputs.apply != true
        run: echo "schema dry-run reviewed for ${{ inputs.manifest_sha }}"
      - name: Apply via approved production runner
        if: inputs.apply == true
        run: gh workflow run deploy-production.yml -f run_migrations=true -f release_sha="${{ inputs.manifest_sha }}"
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
