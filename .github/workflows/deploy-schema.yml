name: Deploy schema
on:
  workflow_dispatch:
    inputs:
      manifest_sha: {description: Integrated release manifest SHA, required: true}
      manifest_path: {description: Release manifest path, required: true, default: ops/microservices/release-manifest.json}
      action: {description: Dry-run or separately authorized apply, type: choice, options: [dry-run, apply], default: dry-run}
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.manifest_sha }}"}
      - name: Validate immutable release manifest
        run: python ops/microservices/validate-release-manifest.py "${{ inputs.manifest_path }}"
      - name: Build deterministic schema plan
        run: python ops/microservices/plan-schema-release.py "${{ inputs.manifest_path }}" > schema-release-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: schema-release-plan-${{ inputs.manifest_sha }}
          path: schema-release-plan.json
          if-no-files-found: error
          retention-days: 30
  apply:
    needs: dry-run
    if: inputs.action == 'apply'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.manifest_sha }}"}
      - name: Synchronize authorized schema controls
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ops/microservices/validate-release-manifest.py,ops/microservices/route-map.json,apps/conversation-runtime/n8n/persona-conversation-template.json,ops/vps/apply-runtime-vector-grant.sh,ops/vps/backup.sh,ops/vps/restore.sh,supabase/migrations/132_runtime_vector_distance_grant.sql,${{ inputs.manifest_path }}
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Apply migration 132 with backup and isolated restore
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}"
            bash ops/vps/apply-runtime-vector-grant.sh "${{ inputs.manifest_path }}" --apply
