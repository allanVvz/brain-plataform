name: Reload production n8n runtime binding

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [dry-run, reload]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: brain-ai-production
  cancel-in-progress: false

jobs:
  reload:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Synchronize approved n8n binding
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Audit or reload n8n binding
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          RELOAD_ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,RELOAD_ACTION
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            expected=http://caddy:8090/conversation-runtime
            python3 -c 'import json; value=json.load(open(".deploy/control/claims-paused.json", encoding="utf-8")); assert value.get("paused") is True, "claims are not paused"'
            [[ "$(docker inspect -f '{{.State.Health.Status}}' brain-ai-n8n-1)" == healthy ]]
            compose=(docker compose --env-file .env.compose -f docker-compose.yml)
            "${compose[@]}" config --quiet
            current="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' brain-ai-n8n-1 | sed -n 's/^API_INTERNAL_BASE_URL=//p')"
            echo "N8N_RUNTIME_BINDING_PLAN current=$current expected=$expected action=$RELOAD_ACTION"
            [[ "$RELOAD_ACTION" == dry-run ]] && exit 0
            [[ "$RELOAD_ACTION" == reload ]] || exit 2
            "${compose[@]}" up -d --no-deps --force-recreate n8n
            for attempt in $(seq 1 36); do
              status="$(docker inspect -f '{{.State.Health.Status}}' brain-ai-n8n-1 2>/dev/null || true)"
              [[ "$status" == healthy ]] && break
              sleep 5
            done
            [[ "$(docker inspect -f '{{.State.Health.Status}}' brain-ai-n8n-1)" == healthy ]]
            current="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' brain-ai-n8n-1 | sed -n 's/^API_INTERNAL_BASE_URL=//p')"
            [[ "$current" == "$expected" ]]
            docker exec brain-ai-n8n-1 node -e 'fetch("http://caddy:8090/conversation-runtime/health/ready").then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))'
            echo "N8N_RUNTIME_BINDING_RESULT=passed binding=$current health=healthy"
