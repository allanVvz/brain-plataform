name: Publish GraphBundle
on:
  workflow_dispatch:
    inputs:
      action:
        description: Compile only, stage, or activate the approved persona graph
        type: choice
        options: [plan, stage, activate]
        default: plan
      bundle_path: {description: Versioned GraphBundle path, required: true}
      persona_slug: {description: Target persona, required: true}
      approved_draft_checksum: {description: Human-approved draft checksum, required: true}
      approved_runtime_checksum: {description: Human-approved runtime checksum, required: true}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r api/requirements.txt
      - name: Compile without publication
        run: python api/scripts/compile_graph_bundle.py "${{ inputs.bundle_path }}" > publication-plan.json
      - name: Verify persona scope, checksums, and publication gates
        run: |
          python ops/microservices/validate-graphbundle-plan.py \
            --bundle "${{ inputs.bundle_path }}" \
            --plan publication-plan.json \
            --persona-slug "${{ inputs.persona_slug }}" \
            --approved-draft-checksum "${{ inputs.approved_draft_checksum }}" \
            --approved-runtime-checksum "${{ inputs.approved_runtime_checksum }}" \
            > graphbundle-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: graphbundle-plan-${{ inputs.persona_slug }}
          path: publication-plan.json
          if-no-files-found: error
          retention-days: 30
  review:
    needs: plan
    environment: production-content
    runs-on: ubuntu-latest
    steps:
      - run: echo "GraphBundle plan validated for one persona."
      - run: echo "Requested action=${{ inputs.action }}; staging and activation remain explicit production-content actions."
  publish:
    needs: [plan, review]
    if: ${{ inputs.action != 'plan' }}
    environment: production-content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the checksum-approved bundle to the production host
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ${{ inputs.bundle_path }}
          target: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          overwrite: true
      - name: Stage or activate through the active control plane
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/brain-ai' }}
          GRAPH_ACTION: ${{ inputs.action }}
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          PERSONA_SLUG: ${{ inputs.persona_slug }}
          APPROVED_DRAFT_CHECKSUM: ${{ inputs.approved_draft_checksum }}
          APPROVED_RUNTIME_CHECKSUM: ${{ inputs.approved_runtime_checksum }}
          PUBLISH_ACTOR: github:${{ github.actor }}:${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR,GRAPH_ACTION,BUNDLE_PATH,PERSONA_SLUG,APPROVED_DRAFT_CHECKSUM,APPROVED_RUNTIME_CHECKSUM,PUBLISH_ACTOR
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            cd "$VPS_APP_DIR"
            [[ "$GRAPH_ACTION" == stage || "$GRAPH_ACTION" == activate ]]
            [[ "$BUNDLE_PATH" == data/graph_bundles/* && "$BUNDLE_PATH" != *..* ]]
            [[ -s "$BUNDLE_PATH" ]]
            python3 -c 'import json; value=json.load(open(".deploy/control/claims-paused.json", encoding="utf-8")); assert value.get("paused") is True, "claims are not paused"'
            state_file=.deploy/microservices/slots.json
            control_slot="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["control-plane"]["active"])' "$state_file")"
            [[ "$control_slot" == blue || "$control_slot" == green ]]
            control_service="control-plane-$control_slot"
            control_container="brain-ai-control-plane-$control_slot-1"
            [[ "$(docker inspect -f '{{.State.Health.Status}}' "$control_container")" == healthy ]]
            compose=(docker compose --env-file .env.compose -f docker-compose.yml -f infra/microservices/docker-compose.blue-green.yml)
            docker cp "$BUNDLE_PATH" "$control_container:/tmp/approved-graphbundle.json"
            args=(
              python scripts/publish_graph_bundle.py /tmp/approved-graphbundle.json
              --approved-draft-checksum "$APPROVED_DRAFT_CHECKSUM"
              --approved-runtime-checksum "$APPROVED_RUNTIME_CHECKSUM"
              --actor "$PUBLISH_ACTOR"
              --apply
            )
            [[ "$GRAPH_ACTION" == activate ]] && args+=(--activate)
            "${compose[@]}" exec -T "$control_service" "${args[@]}"
            "${compose[@]}" exec -T "$control_service" python -c 'import json,sys; from services import supabase_client; slug=sys.argv[1]; expected=sys.argv[2]; persona=supabase_client.get_persona(slug); publication=supabase_client.get_active_graph_publication(str(persona["id"])); print("GRAPH_PUBLICATION_AUDIT="+json.dumps({"persona_slug":slug,"active_publication_id":(publication or {}).get("id"),"version":(publication or {}).get("version"),"checksum":(publication or {}).get("checksum")},sort_keys=True)); assert sys.argv[3] != "activate" or (publication or {}).get("checksum") == expected' "$PERSONA_SLUG" "$APPROVED_RUNTIME_CHECKSUM" "$GRAPH_ACTION"
