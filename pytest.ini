[pytest]
testpaths = tests
python_files = test_*.py
addopts = -p no:cacheprovider
markers =
    unit: pure unit tests with no network, Docker or external service dependency
    contract: local API/service contract tests with explicit mocks or in-process app clients
    integration: tests that require local Docker services or seeded local data
    e2e: end-to-end flows that may drive the running app
    live: tests that require a live backend or external service and must never run by default
